name: One-shot refine 2.4 headlines

on:
  push:
    branches:
      - agent/refine-2-4-headlines
  pull_request:
    branches:
      - main
    types:
      - opened

permissions:
  contents: write

jobs:
  patch:
    if: (github.event_name == 'push' && github.event.head_commit.message == 'Add one-shot 2.4 headline patch') || (github.event_name == 'pull_request' && github.event.action == 'opened' && github.head_ref == 'agent/refine-2-4-headlines')
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/refine-2-4-headlines
          fetch-depth: 0

      - name: Apply agreed project-manager changes
        run: |
          node <<'NODE'
          const fs = require('fs');

          const planPath = 'src/data/kings-edge-plan.json';
          const plan = JSON.parse(fs.readFileSync(planPath, 'utf8'));
          const project = plan.projects.find((item) => item.id === '2.4');
          if (!project) throw new Error('Project 2.4 was not found');

          const deliverable243 = project.deliverables.find((item) => item.id === '2.4.3');
          const deliverable243Before = JSON.stringify(deliverable243);

          project.title = 'Defining, Evidencing and Activating the King’s Graduate Premium';
          project.owner = 'Rachel Kershaw';
          project.summary = 'Builds a credible and externally validated account of the value of a King’s education, enables every student to recognise and communicate what they have gained, and ensures that value is understood and used across King’s and beyond.';

          const changes = {
            '2.4.1': {
              title: 'Graduate Premium Evidence and Insight',
              summary: 'Creates and maintains the institutional, disciplinary, course and market evidence needed to explain what the King’s graduate premium is, where it is strongest and where it should be strengthened.'
            },
            '2.4.2': {
              title: 'External Validation and Future Relevance',
              summary: 'Uses employers, industry, alumni and other external voices to test King’s claims, refresh skills and capability priorities, and keep the graduate premium credible and future-facing.'
            },
            '2.4.4': {
              title: 'Graduate Premium Adoption and Activation',
              summary: 'Ensures the graduate premium is understood and used by students and staff, and recognised by applicants, families, employers, alumni, partners and markets.'
            }
          };

          for (const [id, values] of Object.entries(changes)) {
            const deliverable = project.deliverables.find((item) => item.id === id);
            if (!deliverable) throw new Error(`Deliverable ${id} was not found`);
            Object.assign(deliverable, values);
          }

          if (JSON.stringify(project.deliverables.find((item) => item.id === '2.4.3')) !== deliverable243Before) {
            throw new Error('2.4.3 changed unexpectedly');
          }

          fs.writeFileSync(planPath, `${JSON.stringify(plan, null, 2)}\n`);

          const oldTitle = "Articulating and Evidencing The King's Graduate Premium";
          const newTitle = 'Defining, Evidencing and Activating the King’s Graduate Premium';
          const referenceFiles = [
            'docs/working-modes.md',
            'docs/01-north-star.md',
            'docs/hydration-guide.md',
            'docs/repository-memory.md',
            'docs/04-kings-edge-content-model.md',
            'docs/next-repository-update-brief.md',
            'docs/schema-source-of-truth-audit.md',
            'src/data/enabling-projects.json'
          ];

          for (const file of referenceFiles) {
            const current = fs.readFileSync(file, 'utf8');
            const updated = current.split(oldTitle).join(newTitle);
            if (updated !== current) fs.writeFileSync(file, updated);
          }
          NODE

      - name: Validate data and build
        run: |
          npm ci
          npm run validate:data
          npm run build
          git diff --check

      - name: Commit the refined headlines
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/kings-edge-plan.json src/data/enabling-projects.json docs
          git commit -m 'Refine 2.4 project and deliverable headlines'
          git push origin HEAD:agent/refine-2-4-headlines
