name: Apply Step 4 pilot operating model

on:
  push:
    branches:
      - content/1-4-2-step-4-pilot-operating-model
    paths:
      - .github/workflows/apply-step-4-pilot-model.yml

permissions:
  contents: write

jobs:
  update-step-4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/1-4-2-step-4-pilot-operating-model

      - name: Replace Step 4 content
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/data/deliverables/1.4.2/steps.json';
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));

          const step4 = {
            id: '1.4.2-step-4',
            title: 'Refine the operating model by piloting the first three communities',
            period: { start: 'jan-jun-2027:a', end: 'jan-jun-2027:c' },
            summary: "From January to June 2027, pilot the agreed Strategic Communities of Practice operating model through the Experiential Learning, AI in Education and Inclusive Education communities. Support the three communities to operate under their informal mobilisation leadership, sustain and broaden participation, deliver useful activity and pursue emerging priorities. The pilots will operate from the outset within the governance, accountability, budget-control and escalation arrangements approved through Step 2, with clear decision rights and institutional oversight through King's Academy and the Innovation Committee. Use live operation to test whether the model is practical, proportionate and sufficiently supportive, refining processes, guidance and conventions without reopening the fundamental authority or accountability of the approved governance framework. Capture the evidence and continuity requirements needed to transfer leadership to funded convenors and integrate funded projects from September 2027. Informal leads remain voluntary and interim during this phase and do not assume the full accountability intended for later funded convenors.",
            dependsOn: ['1.4.2-step-2', '1.4.2-step-3'],
            outputs: [
              {
                id: '1.4.2-step-4-output-1',
                title: 'Three community pilots operating',
                type: 'community-pilot',
                owner: "Informal community leads with King's Academy",
                summary: 'Experiential Learning, AI in Education and Inclusive Education each operate as an active pilot community with an identifiable constituency, a clear participation route, functioning informal leadership and sustained communication across the pilot period.',
                acceptanceCriteria: [
                  'Each community has a short pilot plan setting out its initial priorities, participation route, indicative activity and relationship to the common operating model.',
                  'Each community has an active communication space and a clear route through which interested colleagues can join or remain involved.',
                  'Participation extends beyond the informal leads and shows evidence of broadening across relevant faculties, disciplines, professional-services areas or other constituencies.',
                  'Informal leadership is shared where possible, remains explicitly voluntary and interim, and is supported rather than replaced by central portfolio capacity.',
                  'The three communities remain active throughout the January-June pilot rather than relying on a single launch event or isolated meeting.'
                ]
              },
              {
                id: '1.4.2-step-4-output-2',
                title: 'Community-led programmes of activity delivered',
                type: 'pilot-activity-programme',
                owner: "Informal community leads with the King's Academy Portfolio Lead",
                summary: 'A proportionate programme in each community that responds to its own priorities while demonstrating the practical value of sustained exchange, collaboration and institutionally connected activity.',
                acceptanceCriteria: [
                  'Each community delivers at least two purposeful activities during the pilot period rather than being limited to routine coordination meetings.',
                  'Activities may include practice exchange, collaborative inquiry, workshops, resource development, institutional propositions, student involvement, external engagement or connections between related initiatives.',
                  'Each community uses its operating allowance to support at least one event, guest speaker, specialist contributor, student group or external partner where this is relevant to its priorities.',
                  'Each community produces at least one tangible output, collaboration, recommendation or proposition through its pilot activity.',
                  'Activity, participation, expenditure and emerging outputs are recorded proportionately through the shared community and portfolio arrangements.'
                ]
              },
              {
                id: '1.4.2-step-4-output-3',
                title: 'Governance and accountability demonstrated in practice',
                type: 'governance-assurance',
                owner: "King's Academy Portfolio Lead with the Innovation Committee",
                summary: 'The approved governance framework is used consistently across the three pilots, providing visible institutional authority, oversight and financial control while preserving appropriate community autonomy.',
                acceptanceCriteria: [
                  'The Innovation Committee or agreed governing forum is operational and understands its delegated authority before the pilots begin.',
                  "Decision rights are clear across informal community leads, the King's Academy Portfolio Lead, the Portfolio Coordinator, Mark Peace and the governing forum.",
                  'Each community has a clear route for advice, approval, escalation and influence on institutional education policy or practice.',
                  'Budget ownership, delegated approval, expenditure records and material commitments are managed consistently across all three communities.',
                  'Each community provides an approved pilot plan and budget, a light-touch midpoint update and an end-of-pilot account covering participation, activity, expenditure, outputs, risks and emerging impact.',
                  'Material decisions, exceptions and unresolved risks are recorded and routed through the agreed governance arrangements.',
                  'The governance arrangements are judged sufficiently robust to support funded convenors and community-aligned projects from September 2027.'
                ]
              },
              {
                id: '1.4.2-step-4-output-4',
                title: 'Operating model refined through pilot evidence',
                type: 'operating-model-refinement',
                owner: "King's Academy Portfolio Lead with Mark Peace",
                summary: 'An evidence-led refinement of the common operating model that confirms the institutional controls that must remain consistent, improves practical processes and identifies where communities should retain flexibility.',
                acceptanceCriteria: [
                  'The pilot synthesis distinguishes elements of governance, accountability, delegated authority, budget control, reporting, escalation and review that remain fixed across all communities.',
                  'Practical guidance is refined for participation, onboarding, communication, shared leadership, priority-setting, collaborative activity, evidence collection and routes into institutional influence.',
                  'Differences between the three communities are used to identify where standardisation would be unhelpful or disproportionate.',
                  'The actual demand placed on informal leads, the Portfolio Lead, the Portfolio Coordinator and temporary project-management capacity is assessed.',
                  'The adequacy and eligible use of the base community activity allowance are assessed against actual pilot activity and outcomes.',
                  'The Innovation Committee formally receives the pilot synthesis, approves refinements within its authority and escalates any material governance or resource changes through the agreed senior education route.'
                ]
              },
              {
                id: '1.4.2-step-4-output-5',
                title: 'Transition packs for funded convenors and projects',
                type: 'leadership-transition',
                owner: "Informal community leads with the King's Academy Portfolio Coordinator",
                summary: 'A proportionate handover position for each community so that funded convenors and project teams can inherit and strengthen established relationships and activity rather than restarting the communities in September 2027.',
                acceptanceCriteria: [
                  'Each transition pack records the community constituency, participation routes, active relationships, current priorities, work underway and commitments already made.',
                  'The expectations community members have of the funded convenor and the support required from the portfolio team are captured.',
                  'Outputs, propositions or collaborations requiring continuity into the funded cycle are identified.',
                  'Leadership-transition risks and sensitivities are recorded, including how informal leads will remain involved without being treated as pre-selected or displaced.',
                  'The packs are available in time to inform Step 6 appointment, mobilisation and handover arrangements.'
                ]
              }
            ],
            resources: {
              existingCapacity: [
                { role: 'Programme sponsor and operating-model steward', owner: 'Mark Peace', contribution: 'Maintain strategic coherence, support the informal leads, resolve substantive questions and ensure pilot learning informs the wider SCoP model and funded transition.', confidence: 'confirmed', riskIfMissing: 'The pilots may generate activity without a coherent route into operating-model refinement or wider institutional priorities.' },
                { role: 'SCoP portfolio leadership', owner: "King's Academy Portfolio Lead", contribution: 'Provide visible institutional ownership, support and challenge the communities, operate the approved governance arrangements and lead the portfolio-level synthesis and refinement.', confidence: 'developing', riskIfMissing: 'Governance confidence and portfolio coherence would depend excessively on Mark Peace and the model would not demonstrate sustainable institutional ownership.' },
                { role: 'Portfolio administration and coordination', owner: "King's Academy Portfolio Coordinator", contribution: 'Support communications, community spaces, meetings, events, budget records, participation evidence, governance papers and transition packs using the recurrent capacity funded through Step 2.', confidence: 'developing', riskIfMissing: 'Operational and reporting work would fall onto voluntary informal leads or substantive leadership, weakening both participation and control.' },
                { role: 'Temporary pilot project management', owner: 'SCoP Mobilisation Project Manager', contribution: 'Coordinate the three pilots, maintain actions, dependencies and evidence, and support the refinement and handover work using the temporary capacity funded through Step 2.', confidence: 'developing', riskIfMissing: 'The three pilots may proceed inconsistently and fail to produce a coherent evidence base or timely transition.' },
                { role: 'Voluntary informal community leadership', owner: 'Informal community leads and champions', contribution: 'Shape priorities, connect participants, host or enable activity, advise on the operating model and prepare continuity for funded leadership within a shared, bounded and supported voluntary role.', confidence: 'developing', riskIfMissing: 'The pilots would lack community legitimacy and distributed leadership; if the role is insufficiently bounded, informal leads may become unfunded substitutes for later convenors.' },
                { role: 'Community members, students and institutional or external partners', owner: 'Participating colleagues and partners', contribution: 'Contribute practice, expertise, challenge, activity and collaboration so that the model is tested through meaningful community work rather than central process alone.', confidence: 'developing', riskIfMissing: 'The pilots would test administration rather than the ability of communities to create useful exchange, collaboration and institutional influence.' }
              ],
              newInvestment: [
                {
                  id: '1.4.2-step-4-resource-investment-1',
                  item: 'Base community activity and engagement allowance',
                  category: 'recurrent community operating funding',
                  amount: 12000,
                  currency: 'GBP',
                  bauLiability: true,
                  fundingRoute: 'TBC',
                  fundingStatus: 'unconfirmed',
                  owner: "King's Academy",
                  periodNeeded: 'From January 2027 onward; £6,000 for the January-June 2027 pilot and £12,000 per full academic year thereafter',
                  decisionNeededBy: 'Before January 2027 pilot activity is commissioned',
                  confidence: 'indicative',
                  rationale: 'Establishes a minimum viable recurrent operating allowance of £4,000 per community per full academic year, pro-rated to £2,000 per community for the six-month pilot. It enables guest speakers, modest events and hospitality, facilitation, materials, communications, student participation, accessibility costs and limited specialist or partner contributions. It is separate from convenor workload release, permanent staffing and substantive funded projects, which are added through later steps.',
                  riskIfMissing: 'The communities could still meet, but visible activity would depend on goodwill and uneven local budgets, reducing participation, credibility and the reliability of evidence about the operating model.'
                }
              ],
              enablingConditions: [
                { condition: 'The SCoP governance and accountability framework is approved, the governing forum is operational and delegated authority is communicated before the pilots begin.', owner: "King's Academy Portfolio Lead with the senior education governance sponsor", decisionNeededBy: 'Before January 2027', confidence: 'developing', riskIfMissing: 'Pilot language could be interpreted as permission to improvise governance, weakening institutional confidence and financial control.' },
                { condition: "King's Academy is confirmed as budget holder and implements proportionate approval, recording, monitoring and year-end treatment for community operating allowances.", owner: "King's Academy with Finance", decisionNeededBy: 'Before the pilot allowances are released', confidence: 'developing', riskIfMissing: 'Communities may have nominal funding without a workable or controlled route to spend it.' },
                { condition: 'Informal leaders agree a bounded voluntary role and central support is available for administration, communications, events, budget records and reporting.', owner: "King's Academy Portfolio Lead", decisionNeededBy: 'Before pilot plans are agreed', confidence: 'developing', riskIfMissing: 'The pilot may depend on excessive goodwill or turn informal leadership into an unfunded substitute for convenorship.' }
              ]
            },
            risks: [
              { title: 'Pilot language undermines confidence in institutional governance', mitigation: 'Communicate that the governance and accountability framework has already been approved and that the pilot tests practical operation and proportionality, not whether governance is required. Keep decision rights, reporting, budget control and escalation visible throughout.' },
              { title: 'Informal leads become de facto unfunded convenors', mitigation: 'Keep the role shared, voluntary, interim and bounded; place administration and formal budget control with the portfolio team; and reserve substantive accountability and workload support for the funded appointments.' },
              { title: 'A common operating model over-standardises different communities', mitigation: 'Separate fixed institutional controls from flexible community practices and use evidence from all three pilots to identify where variation is necessary and productive.' },
              { title: 'The recurrent activity allowance becomes an untested entitlement', mitigation: 'Treat £4,000 per community as a planning assumption, review its adequacy and use through the pilot, and base later portfolio scaling on evidence while preserving the initial £12,000 annual BAU liability unless formally revised.' },
              { title: 'Activity is visible but produces weak learning or continuity', mitigation: 'Use agreed pilot plans, midpoint updates, proportionate evidence and transition packs so that activity informs operating-model refinement and the September 2027 funded handover.' }
            ]
          };

          const index = data.steps.findIndex((step) => step.id === '1.4.2-step-4');
          if (index < 0) throw new Error('Step 4 not found');
          data.steps[index] = step4;
          if (step4.outputs.length !== 5) throw new Error('Unexpected output count');
          if (step4.resources.newInvestment[0].amount !== 12000 || step4.resources.newInvestment[0].bauLiability !== true) throw new Error('BAU allowance validation failed');
          fs.writeFileSync(path, JSON.stringify(data));
          NODE

      - name: Validate JSON
        run: node -e "const d=require('./src/data/deliverables/1.4.2/steps.json'); const s=d.steps.find(x=>x.id==='1.4.2-step-4'); if(!s || s.title!=='Refine the operating model by piloting the first three communities') process.exit(1)"

      - name: Commit Step 4
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/data/deliverables/1.4.2/steps.json
          git commit -m "Define the first three community pilots"
          git push origin HEAD:content/1-4-2-step-4-pilot-operating-model
