name: Develop SCoP Step 7

on:
  push:
    branches:
      - content/1-4-2-develop-step-7
    paths:
      - .github/workflows/apply-developed-step-7.yml

permissions:
  contents: write

jobs:
  update-step-7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/1-4-2-develop-step-7

      - name: Develop Step 7
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/data/deliverables/1.4.2/steps.json';
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));
          const step = data.steps.find((item) => item.id === '1.4.2-step-7');
          if (!step) throw new Error('Step 7 not found');

          step.title = 'Operate the first funded three-community cycle';
          step.period = { start: 'jul-dec-2027:b', end: 'jan-jun-2028:c' };
          step.stepType = 'funded-community-operating-cycle';
          step.dependsOn = ['1.4.2-step-5', '1.4.2-step-6'];
          step.summary = "From September 2027 to June 2028, operate the first fully funded Strategic Communities of Practice cycle across Experiential Learning, AI in Education and Inclusive Education. Bring the funded convenors appointed through Step 5 into their roles, activate the agreed release, workload-allocation or backfill arrangements, and deliver a visible programme of community activity aligned to the priorities of each community. Maintain the distributed participation and professional energy through which the communities originally formed, while using protected convenor capacity to provide continuity, connection, purposeful leadership and institutional influence. Deliver approximately five practice-based projects across the portfolio. Each project should use its protected capacity and direct-cost allowance to develop, test or spread useful educational practice, create collaboration and generate institutional learning rather than operating as a disconnected research project. Apply the common reach and impact framework established through Step 6, gathering proportionate evidence of active reach, distributed leadership, practice development and spread, institutional influence and student-facing educational impact. Use termly review points to identify where communities or projects need support, adaptation or escalation, and complete a year-end portfolio account by June 2028 to inform the formal operating-cycle review in Step 9.";

          step.outputs = [
            {
              id: '1.4.2-step-7-output-1',
              title: 'Funded community leadership and annual plans operational',
              type: 'funded-community-leadership-in-operation',
              owner: "King's Academy SCoP Portfolio Lead with the funded convenors",
              summary: 'The first funded convenors are active in role, their protected capacity is operating, and each of the three communities has an agreed September-June plan connected to its strategic education purpose.',
              acceptanceCriteria: [
                'The Experiential Learning, AI in Education and Inclusive Education communities each have one or two funded convenors active in role for the first year of their two-academic-year appointments.',
                'The shared 0.1 FTE community-level protected-capacity arrangement is activated for each community and any co-convenor split is implemented as commissioned.',
                'Each community has an approved September-June plan covering priorities, participation, activity, collaboration, intended outputs, institutional contribution, reach and impact evidence, budget and principal risks.',
                'Responsibilities and decision rights are clear across convenors, community contributors, the Portfolio Lead, the Portfolio Coordinator and the Innovation Committee.',
                'Convenors use their protected role to enable and connect distributed participation rather than becoming the sole deliverers of all community activity.',
                'The handover from informal mobilisation leadership preserves useful relationships, continuity and routes for existing contributors to remain involved.'
              ]
            },
            {
              id: '1.4.2-step-7-output-2',
              title: 'Three funded community programmes delivered',
              type: 'community-programme-delivery',
              owner: 'Funded community convenors',
              summary: 'A visible and purposeful programme of activity delivered by each community, supporting exchange, collaboration, development of practice and contribution to institutional education priorities.',
              acceptanceCriteria: [
                'Each community delivers a visible programme of activity across the academic year rather than relying on a single launch or event.',
                'Activity creates regular opportunities for colleagues to exchange, develop, test or spread educational practice and to form useful collaborations.',
                'Participation and contribution extend beyond the funded convenor or convenors and include appropriate cross-faculty and professional-services representation.',
                'Each community produces or progresses tangible outputs, recommendations, resources, collaborations or other products appropriate to its theme.',
                'Community insight is connected to relevant faculty and institutional education discussions, including the Education Delivery Framework where appropriate.',
                'The continuing £4,000 annual base activity allowance per community is used in accordance with the Step 2 eligible-use framework and is reported without being counted again as new Step 7 investment.'
              ]
            },
            {
              id: '1.4.2-step-7-output-3',
              title: 'First funded practice-based project portfolio delivered',
              type: 'practice-based-project-delivery',
              owner: 'Funded project leads with the relevant community convenors',
              summary: 'Approximately five funded projects delivered across the three-community portfolio, each developing, testing or spreading useful educational practice and contributing to one or more communities.',
              acceptanceCriteria: [
                'Approximately five commissioned projects begin with named leads, delivery teams, confirmed community connections, agreed outputs, timetable, budget and evidence approach.',
                'The 0.1 FTE project-level release, workload-allocation or backfill arrangement is activated for each project and may be divided across a small team within the commissioned envelope.',
                'Each project may use up to £1,000 of direct delivery expenditure for eligible costs and maintains proportionate financial records.',
                'Projects remain connected to one or more communities through shared activity, challenge, dissemination, collaboration or contribution to community priorities.',
                'Each project delivers the agreed practical output or learning and records evidence of use, adoption, adaptation, further development or credible potential for spread.',
                'Projects normally complete by June 2028; any extension is exceptional, time-limited, approved through the agreed governance route and does not obscure the performance of the annual portfolio.',
                'Material underspend, non-delivery or change of scope is identified early and addressed through support, re-scoping, recovery, reallocation or closure.'
              ]
            },
            {
              id: '1.4.2-step-7-output-4',
              title: 'Reach, impact and institutional influence evidenced',
              type: 'benefit-realisation-evidence',
              owner: "King's Academy SCoP Portfolio Coordinator and Portfolio Lead with convenors and project leads",
              summary: 'The common reach and impact framework established in Step 6 is applied proportionately across the live communities and projects, generating usable evidence rather than vanity metrics or unsupported claims.',
              acceptanceCriteria: [
                'Termly evidence is gathered against the five common measures: active reach and institutional breadth; depth of participation and distributed leadership; practice development and spread; institutional influence; and student-facing educational impact.',
                'Mailing-list membership and one-off attendance are distinguished from active, repeat and contributory participation.',
                'Participation gaps, institutional concentrations and unequal patterns of contribution are made visible and prompt proportionate support or adaptation.',
                'Evidence distinguishes production of outputs from actual use, adoption, adaptation or spread.',
                'Community recommendations and insight entering faculty or institutional decision routes are recorded together with what happened as a result.',
                'Student-facing impact is evidenced through bounded and proportionate evidence chains or case studies without claiming causality that the evidence cannot support.',
                'Evidence collection remains light-touch enough to support learning and accountability without crowding out community or project delivery.'
              ]
            },
            {
              id: '1.4.2-step-7-output-5',
              title: 'First funded-cycle portfolio account completed',
              type: 'annual-portfolio-account',
              owner: "King's Academy SCoP Portfolio Lead with the Innovation Committee",
              summary: 'A concise but substantive account of the first funded cycle, providing the evidence handoff required for the formal review in Step 9.',
              acceptanceCriteria: [
                'The account covers each community and the overall portfolio, including activity, active participation, distributed leadership, outputs, project delivery and expenditure.',
                'The account synthesises evidence of practice development and spread, institutional influence and student-facing contribution, including limitations and evidence gaps.',
                'Material variation between communities or projects, unresolved risks, support needs, recovery actions and governance decisions are recorded transparently.',
                'The status of every commissioned project is clear, including completion, approved extension, re-scope, closure, underspend or outstanding evidence.',
                'The account identifies learning and questions requiring formal consideration through Step 9 without pre-empting that review.',
                'The Innovation Committee receives and accepts the portfolio account by the end of June 2028.'
              ]
            }
          ];

          step.resources = {
            existingCapacity: [
              {
                role: 'SCoP Portfolio Lead',
                owner: "King's Academy",
                fte: 0.2,
                contribution: 'Provide strategic and substantive leadership for the three-community cycle, support and challenge convenors, maintain portfolio coherence, connect community insight to institutional routes and lead termly and annual review using capacity established through Steps 2 and 6.',
                periodNeeded: 'September 2027 to June 2028',
                confidence: 'developing',
                riskIfMissing: 'Convenors and projects may operate without sufficient support, challenge, strategic connection or portfolio-level learning.'
              },
              {
                role: 'SCoP Portfolio Coordinator',
                owner: "King's Academy",
                fte: 0.4,
                contribution: 'Coordinate community and project administration, records, budgets, reporting, termly review, reach and impact evidence, governance papers and preparation for the next commissioning cycle using capacity established through Steps 2 and 6.',
                periodNeeded: 'September 2027 to June 2028',
                confidence: 'developing',
                riskIfMissing: 'Administration, evidence and financial control may fall onto convenors or substantive leaders and weaken delivery or institutional memory.'
              },
              {
                role: 'Base community activity allowance',
                owner: "King's Academy budget holder with community convenors",
                contribution: 'Provide the continuing £12,000 annual portfolio allowance established in Step 4, equivalent to £4,000 for each of the three communities, for eligible community activity, participation, collaboration, dissemination and outputs.',
                periodNeeded: 'September 2027 to June 2028',
                confidence: 'indicative',
                riskIfMissing: 'Convenors would have protected leadership time but insufficient practical resource to sustain visible and inclusive community activity.'
              },
              {
                role: 'Innovation Committee oversight',
                owner: 'Innovation Committee',
                contribution: 'Review plans and evidence, provide challenge and support, approve material changes, manage escalation and receive the year-end portfolio account.',
                periodNeeded: 'September 2027 to June 2028',
                confidence: 'developing',
                riskIfMissing: 'The funded cycle may operate without consistent accountability, challenge, escalation or institutional decision-making.'
              },
              {
                role: 'Faculty and organisational implementation support',
                owner: 'Faculty education leadership, faculty operations, Finance, HR and relevant professional services',
                contribution: 'Maintain the local workload, release or backfill arrangements; support delivery; resolve employment, finance and operational issues; and enable practice to be adopted or spread.',
                periodNeeded: 'September 2027 to June 2028',
                confidence: 'developing',
                riskIfMissing: 'Commissioned capacity may not translate into usable time and projects or communities may be blocked by local operational barriers.'
              }
            ],
            newInvestment: [
              {
                id: '1.4.2-step-7-resource-investment-1',
                item: 'Funded convenor protected capacity for the first three communities',
                category: 'community leadership release or backfill',
                estimatedCost: 'Cash cost to be calculated against the appointed convenors, grades and agreed faculty or organisational release, workload-allocation or backfill routes.',
                fundingRoute: 'Resource authority reserved through Step 5; final budget and local implementation routes confirmed before September 2027',
                fundingStatus: 'commissioned for the first funded cycle',
                owner: "King's Academy with the relevant faculties or organisational areas",
                periodNeeded: 'September 2027 to June 2028',
                confidence: 'developing',
                rationale: 'Activates 0.1 FTE of protected capacity for each of the three communities, shared where co-convenors have been appointed, so leadership is sustainable rather than dependent on goodwill.',
                riskIfMissing: 'The funded model would revert to informal and unprotected leadership, undermining continuity, credibility and community development.',
                fte: 0.3
              },
              {
                id: '1.4.2-step-7-resource-investment-2',
                item: 'Protected capacity for the first annual practice-based project portfolio',
                category: 'project lead release or backfill',
                estimatedCost: 'Cash cost to be calculated against the selected project leads, grades and agreed faculty or organisational release, workload-allocation or backfill routes.',
                fundingRoute: 'Resource authority reserved through Step 5; final budget and local implementation routes confirmed before September 2027',
                fundingStatus: 'commissioned for the first funded cycle',
                owner: "King's Academy with the relevant faculties or organisational areas",
                periodNeeded: 'September 2027 to June 2028',
                confidence: 'developing',
                rationale: 'Activates an indicative 0.1 FTE protected-capacity envelope for each of approximately five projects, divisible across a small delivery team, so practice-based development is feasible alongside existing roles.',
                riskIfMissing: 'Projects may be nominally funded but remain dependent on unprotected overtime or may fail to deliver the intended practical change.',
                fte: 0.5
              },
              {
                id: '1.4.2-step-7-resource-investment-3',
                item: 'Direct delivery costs for the first practice-based project portfolio',
                category: 'practice-based project delivery',
                amount: 5000,
                currency: 'GBP',
                fundingRoute: 'Resource authority reserved through Step 5; budget held and controlled through the agreed SCoP portfolio route',
                fundingStatus: 'commissioned for the first funded cycle',
                owner: "King's Academy SCoP budget holder",
                periodNeeded: 'September 2027 to June 2028',
                confidence: 'developing',
                rationale: 'Provides up to £1,000 per project for eligible direct costs such as materials, small events, student participation, accessibility, modest specialist input or dissemination.',
                riskIfMissing: 'Protected staff capacity may be available but projects could be unable to undertake the practical activity needed to test, engage or disseminate their work.'
              }
            ],
            enablingConditions: [
              {
                condition: 'Complete all April-August onboarding, workload, budget, commissioning and readiness actions agreed through Step 5 before the funded cycle begins.',
                owner: "King's Academy SCoP Portfolio Coordinator with faculties, convenors and project leads",
                decisionNeededBy: 'Before September 2027',
                confidence: 'developing',
                riskIfMissing: 'The operating cycle may begin with nominal appointments but inaccessible capacity, budgets or unresolved conditions.'
              },
              {
                condition: 'Translate the Step 6 reach and impact framework into practical templates, definitions, evidence responsibilities and termly review arrangements.',
                owner: "King's Academy SCoP Portfolio Lead and Portfolio Coordinator",
                decisionNeededBy: 'Before the first termly reporting point',
                confidence: 'developing',
                riskIfMissing: 'Evidence may become inconsistent, burdensome or dominated by simple attendance counts.'
              },
              {
                condition: 'Maintain sufficient central capacity to support the live three-community cycle while simultaneously administering the 2028 commissioning and six-community preparation activity.',
                owner: "King's Academy",
                decisionNeededBy: 'Before January 2028 commissioning activity intensifies',
                confidence: 'developing',
                riskIfMissing: 'Forward expansion work may crowd out support, oversight and learning from the first funded cycle.'
              },
              {
                condition: 'Keep appropriate faculty, Finance, HR and governance routes available to resolve workload, expenditure, delivery, safeguarding, information-governance or other operational issues promptly.',
                owner: 'SCoP Portfolio Lead with relevant institutional and faculty owners',
                decisionNeededBy: 'Throughout the operating cycle',
                confidence: 'developing',
                riskIfMissing: 'Projects and community activity may stall while issues move between unclear institutional owners.'
              }
            ]
          };

          step.decisions = [
            {
              title: 'Approve the three community and project delivery plans',
              summary: 'Confirm that the September-June plans, budgets, reach and impact intentions, responsibilities and risks remain consistent with the commissioned portfolio before substantive delivery begins.'
            },
            {
              title: 'Decide material changes, recovery or reallocation',
              summary: 'Use termly review points to approve significant changes of scope, recovery actions, project closure, use of reserve capacity or reallocation of uncommitted direct expenditure.'
            },
            {
              title: 'Decide exceptional project extensions',
              summary: 'Approve only time-limited and justified extensions beyond June 2028, with clear ownership, residual budget, evidence and an explanation of how the project will remain visible in the annual portfolio account.'
            },
            {
              title: 'Accept the first funded-cycle portfolio account',
              summary: 'Confirm that the year-end account provides a sufficiently complete and balanced evidence handoff for the formal Step 9 review.'
            }
          ];

          step.risks = [
            {
              title: 'Approved protected capacity is not usable in practice',
              mitigation: 'Track actual release or workload implementation from the start, require named local owners and escalate promptly where commissioned capacity is being absorbed by unchanged duties.'
            },
            {
              title: 'Convenors become sole organisers rather than enablers of distributed leadership',
              mitigation: 'Use annual plans and termly review to test the breadth of contribution, create explicit routes for members to lead activity and assess depth of participation separately from convenor delivery.'
            },
            {
              title: 'Funded projects detach from their communities',
              mitigation: 'Require ongoing community connection, include project activity in community programmes and review contribution to shared priorities rather than assessing projects only as standalone outputs.'
            },
            {
              title: 'Reach is inflated by nominal membership and one-off attendance',
              mitigation: 'Apply the Step 6 definitions consistently and report mailing lists and one-off attendance separately from active, repeat and contributory participation.'
            },
            {
              title: 'Evidence collection becomes performative or burdensome',
              mitigation: 'Use a small common core, reuse routine records, gather short bounded case studies and remove evidence requests that do not support learning, accountability or a real decision.'
            },
            {
              title: 'Student-facing impact is overclaimed',
              mitigation: 'Use proportionate contribution evidence, state limitations and avoid asserting direct causation or movement in common outcomes where the timeframe and evidence cannot support it.'
            },
            {
              title: 'Performance varies sharply across communities or projects',
              mitigation: 'Use termly review to identify variation early, provide tailored support and challenge, agree recovery or re-scope, and preserve transparent evidence rather than smoothing out differences at portfolio level.'
            },
            {
              title: 'Expansion activity distracts central support from the live cycle',
              mitigation: 'Protect the Step 6 central-capacity increase, plan commissioning activity explicitly and monitor whether support to operating communities or evidence quality is declining as the next portfolio is prepared.'
            }
          ];

          step.assumptions = [
            {
              title: 'Convenor capacity is allocated per community',
              summary: 'Each community has a total 0.1 FTE protected-capacity envelope, shared rather than duplicated where two convenors are appointed.'
            },
            {
              title: 'Project capacity is allocated per project',
              summary: 'Each commissioned project has an indicative 0.1 FTE protected-capacity envelope that may be divided across a small team, plus up to £1,000 of eligible direct delivery expenditure.'
            },
            {
              title: 'Projects normally complete within the annual cycle',
              summary: 'The first practice-based project portfolio normally completes by June 2028; extensions are exceptional and do not silently roll into the next annual commissioning cycle.'
            },
            {
              title: 'Step 6 success definitions are operational before evidence is due',
              summary: 'The reach and impact baselines, targets or qualitative thresholds, definitions, templates and ownership arrangements established through Step 6 are available early enough to shape delivery and termly review.'
            },
            {
              title: 'Previously established recurrent capacity is not counted twice',
              summary: 'The base community activity allowance and central Portfolio Lead and Coordinator capacity established through Steps 2, 4 and 6 remain visible as continuing capacity but are not duplicated as new Step 7 investment.'
            }
          ];

          const ids = data.steps.map((item) => item.id);
          if (new Set(ids).size !== ids.length) throw new Error('Duplicate step IDs');
          const idSet = new Set(ids);
          for (const candidate of data.steps) {
            for (const dependency of candidate.dependsOn || []) {
              if (!idSet.has(dependency)) throw new Error(`Invalid dependency ${dependency} on ${candidate.id}`);
            }
          }
          if (JSON.stringify(step.dependsOn) !== JSON.stringify(['1.4.2-step-5', '1.4.2-step-6'])) throw new Error('Step 7 dependencies changed unexpectedly');
          if (step.outputs.length !== 5) throw new Error('Step 7 should have five developed outputs');
          if (step.resources.newInvestment.length !== 3) throw new Error('Step 7 should carry three operating investment asks');
          if (step.resources.newInvestment.find((item) => item.id === '1.4.2-step-7-resource-investment-3')?.amount !== 5000) throw new Error('Direct project expenditure is not £5,000');
          if (!step.summary.includes('September 2027 to June 2028')) throw new Error('Step 7 operating period is missing');
          if (!step.summary.includes('Apply the common reach and impact framework')) throw new Error('Step 7 evidence model is missing');

          fs.writeFileSync(path, JSON.stringify(data));
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Validate and build
        run: npm run build

      - name: Commit developed Step 7
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/data/deliverables/1.4.2/steps.json
          git commit -m "Develop first funded SCoP operating cycle"
          git push origin HEAD:content/1-4-2-develop-step-7
