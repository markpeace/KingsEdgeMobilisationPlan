name: Develop SCoP Steps 8 to 10

on:
  push:
    branches:
      - content/1-4-2-develop-steps-8-10
    paths:
      - .github/workflows/apply-developed-steps-8-10.yml

permissions:
  contents: write

jobs:
  update-steps-8-10:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/1-4-2-develop-steps-8-10

      - name: Develop Steps 8 to 10
        run: |
          node <<'NODE'
