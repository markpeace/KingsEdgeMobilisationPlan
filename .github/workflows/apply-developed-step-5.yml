name: Develop SCoP Step 5

on:
  push:
    branches:
      - content/1-4-2-develop-step-5
    paths:
      - .github/workflows/apply-developed-step-5.yml

permissions:
  contents: write

jobs:
  update-step-5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/1-4-2-develop-step-5

      - name: Develop Step 5
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/data/deliverables/1.4.2/steps.json';
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));
          const step = data.steps.find((item) => item.id === '1.4.2-step-5');
          if (!step) throw new Error('Step 5 not found');

          step.title = 'Commission the first funded community and project cycle';
          step.period = { start: 'jan-jun-2027:a', end: 'jan-jun-2027:b' };
          step.stepType = 'community-and-project-commissioning';
          step.dependsOn = ['1.4.2-step-2'];
          step.summary = "From January to March 2027, move the Experiential Learning, AI in Education and Inclusive Education communities from an initial phase sustained largely through informal coalescing, professional goodwill and enthusiasm towards a more durable funded model for the 2027-28 academic year. Run an open call to identify and support a very small number of funded convenors who can provide consistent leadership across the three communities, normally one or two convenors per community appointed for two academic years. Alongside this, invite proposals for approximately five practice-based projects that advance the priorities and development of the communities, creating useful activity, collaboration, outputs and institutional learning rather than funding disconnected projects or a general research-grant scheme. Agree the successful convenors and project portfolio by the end of March, together with written faculty or organisational commitments in principle, the protected-capacity model, reserved funding authority, governance and reporting expectations, and the April-August preparation route required for activity to begin in September 2027. Relevant learning from the Step 4 pilots should inform the process and handover as it becomes available, but completion of the pilots is not a prerequisite for commissioning the funded cycle. The purpose is not to replace the energy, relationships and distributed participation through which the communities have formed, but to provide enough protected leadership and practical project support for that activity to become sustainable, purposeful and institutionally connected.";

          step.outputs = [
            {
              id: '1.4.2-step-5-output-1',
              title: 'Open convenor and practice-based project calls delivered',
              type: 'commissioning-process',
              owner: "King's Academy SCoP Portfolio Lead and Portfolio Coordinator",
              summary: 'Coordinated but distinct open calls through which funded convenors and practice-based projects are invited, supported and assessed as parts of one coherent community portfolio.',
              acceptanceCriteria: [
                'The convenor call defines the role, two-academic-year term, expected contribution, accountability, indicative protected capacity and relationship with King\'s Academy and the Innovation Committee.',
                'The call permits one or two convenors per community, with a single 0.1 FTE community-level allocation shared where co-convenors are appointed.',
                'The project call seeks approximately five practice-based projects across the portfolio and defines eligibility, purpose, delivery period, expected outputs, reporting and eligible direct costs.',
                'Each project is offered an indicative 0.1 FTE release, workload allocation or backfill envelope for one academic year, divisible across a small project team, together with up to £1,000 for direct delivery costs.',
                'The 0.1 FTE project assumption is presented as a costable planning proxy broadly comparable to leading a 15-credit unit, subject to validation through the relevant faculty or organisational workload model.',
                'Academic and professional-services staff, collaborative staff teams and teams involving students or external partners may apply, provided a named King\'s staff member holds responsibility.',
                'Assessment criteria, decision rights, timetable, applicant guidance and conflict-of-interest arrangements are published before applications open.',
                'Informal mobilisation leads are eligible to apply through the open process but receive no automatic status or selection advantage.'
              ]
            },
            {
              id: '1.4.2-step-5-output-2',
              title: 'Funded convenors commissioned for the first three communities',
              type: 'funded-community-leadership',
              owner: 'Innovation Committee on the recommendation of the convenor selection panel',
              summary: 'One or two funded convenors commissioned for each of the three communities, with protected capacity and credible institutional support for a September 2027 start.',
              acceptanceCriteria: [
                'Each of the Experiential Learning, AI in Education and Inclusive Education communities has one or two approved funded convenors.',
                'Convenors are appointed for the 2027-28 and 2028-29 academic years, subject to satisfactory annual review rather than annual reapplication.',
                'Each community has an agreed protected-capacity envelope equivalent to 0.1 FTE, or approximately half a day per week, shared where two convenors are appointed.',
                'Selection considers community-building capability, institutional reach, strategic judgement, inclusive leadership and the ability to translate community activity into useful outputs and influence.',
                'The relevant faculty or organisational area provides written confirmation in principle of how release, workload allocation or backfill will be enabled from September 2027.',
                'The role, term, responsibilities, accountability and decision rights are clear across convenors, the SCoP Portfolio Lead, the Portfolio Coordinator and the Innovation Committee.',
                'Any co-convening arrangement records how the shared protected capacity and leadership responsibilities will be divided.',
                'Unsuccessful applicants receive a clear outcome and an appropriate feedback route.'
              ]
            },
            {
              id: '1.4.2-step-5-output-3',
              title: 'First practice-based project portfolio commissioned',
              type: 'funded-project-portfolio',
              owner: 'Innovation Committee on the recommendation of the project selection panel',
              summary: 'Approximately five practice-based projects commissioned as a coherent portfolio that advances one or more of the three communities and creates useful educational practice, collaboration and institutional learning.',
              acceptanceCriteria: [
                'Approximately five projects are selected across the portfolio, with no automatic or equal allocation by community.',
                'Each project is clearly connected to one or more communities and to an identified education priority, challenge or opportunity.',
                'Each project has a named King\'s lead, defined purpose, intended beneficiaries, outputs, delivery period, evidence approach and preparation route.',
                'Each project has an approved 0.1 FTE release, workload allocation or backfill envelope for one academic year and up to £1,000 for direct delivery costs, to become operational through Step 7.',
                'Projects are additional to ordinary business and do not fund activity that should already be delivered through established roles or budgets.',
                'The final portfolio considers quality, strategic relevance, feasibility, diversity of approach, duplication and opportunities for cross-community collaboration.',
                'Preferred convenors may advise on community fit and portfolio coherence, but formal decisions remain with an independent panel or the Innovation Committee and all conflicts of interest are declared and managed.',
                'The option not to allocate all funding, to retain a reserve list or to run a targeted second-stage process is preserved where proposal quality is insufficient.'
              ]
            },
            {
              id: '1.4.2-step-5-output-4',
              title: 'Institutional commitments and commissioning confirmations secured',
              type: 'commissioning-commitment',
              owner: "King's Academy SCoP Portfolio Lead with faculties, Finance and organisational sponsors",
              summary: 'The selected portfolio moves beyond a preferred list: the institutional, faculty and funding commitments required for a credible September start are agreed by the end of March.',
              acceptanceCriteria: [
                'Written faculty or organisational commitment in principle is secured for every selected convenor and project requiring release, workload allocation or backfill.',
                'Funding authority is confirmed and reserved for the Step 7 operating requirement: 0.3 FTE of convenor capacity across three communities, approximately 0.5 FTE across five annual projects and up to £5,000 of direct project expenditure.',
                'The funding source, budget holder, authorisation route and financial-control expectations are identified.',
                'Conditional offers or commissioning confirmations are issued to successful convenors and project leads by the end of March 2027.',
                'Any outstanding HR, workload, financial or administrative conditions have named owners and deadlines during April-August.',
                'No selected convenor or project remains dependent on an unspecified later decision about whether the agreed capacity or direct-cost funding will exist.',
                'The resource commitment is handed forward to Step 7, where the funded capacity and expenditure become operational; it is not duplicated as new delivery investment in Step 5.'
              ]
            },
            {
              id: '1.4.2-step-5-output-5',
              title: 'April-August preparation and community handover route agreed',
              type: 'readiness-plan',
              owner: "King's Academy SCoP Portfolio Coordinator",
              summary: 'A clear route through which successful convenors, project leads, faculties and King\'s Academy complete the practical preparation required for the funded cycle to begin in September 2027.',
              acceptanceCriteria: [
                'Each convenor and project lead has a proportionate onboarding and preparation timetable for April-August.',
                'Named owners are assigned for formal workload processing, budget setup, commissioning documentation, induction, community planning and project readiness.',
                'The transition from informal mobilisation leadership to funded convening is planned sensitively and does not displace existing community relationships or participation.',
                'Relevant learning, continuity material and transition packs from Step 4 can be incorporated as they become available without reopening the core commissioning decisions.',
                'Each community will have an agreed September-June activity plan and each project an agreed delivery plan before the funded cycle begins.',
                'A readiness checkpoint is scheduled before September 2027, with a clear route for resolving outstanding conditions or adjusting scope.'
              ]
            }
          ];

          step.resources = {
            existingCapacity: [
              {
                role: 'SCoP Portfolio Lead',
                owner: "King's Academy",
                fte: 0.1,
                contribution: 'Own the commissioning process, maintain strategic coherence across the three communities, lead recommendations and ensure selected convenors and projects form a credible portfolio.',
                periodNeeded: 'January to March 2027, with preparation oversight through August 2027',
                confidence: 'developing',
                riskIfMissing: 'The calls could be administered without sufficient substantive ownership, coherence or accountability.'
              },
              {
                role: 'SCoP Portfolio Coordinator',
                owner: "King's Academy",
                fte: 0.2,
                contribution: 'Administer communications, applications, panel records, conflicts, commissioning confirmations, conditions, onboarding and readiness tracking using capacity already introduced through Step 2.',
                periodNeeded: 'January to August 2027',
                confidence: 'developing',
                riskIfMissing: 'The process may be delayed, inconsistently documented or unable to convert decisions into a ready September portfolio.'
              },
              {
                role: 'Temporary SCoP Mobilisation Project Manager',
                owner: 'Mark Peace',
                fte: 0.1,
                contribution: 'Provide first-cycle project control, coordinate dependencies and decisions, and support the handover of commissioning administration into the permanent portfolio model.',
                periodNeeded: 'January to August 2027',
                confidence: 'indicative',
                riskIfMissing: 'The first commissioning cycle may place excessive coordination demand on substantive leads and permanent support that is still establishing its routines.'
              },
              {
                role: 'Selection and decision-making capacity',
                owner: 'Innovation Committee and independently constituted selection panels',
                contribution: 'Assess convenor and project applications, manage conflicts, consider portfolio coherence and make or recommend transparent commissioning decisions.',
                periodNeeded: 'January to March 2027',
                confidence: 'developing',
                riskIfMissing: 'Selections may lack independence, transparency, community coherence or legitimate institutional authority.'
              },
              {
                role: 'Faculty, Finance, HR and organisational implementation input',
                owner: 'Faculty education leadership, faculty operations, Finance and HR',
                contribution: 'Validate workload and backfill routes, confirm commitments in principle, identify budget and employment processes and complete local arrangements after commissioning.',
                periodNeeded: 'January to August 2027',
                confidence: 'developing',
                riskIfMissing: 'Successful applicants could be selected without a practicable route to protected capacity or a September start.'
              }
            ],
            newInvestment: [],
            enablingConditions: [
              {
                condition: 'Approve and reserve the resource envelope that will become operational through Step 7: 0.1 FTE per community for convening, approximately five 0.1 FTE annual project allocations and up to £1,000 direct expenditure per project.',
                owner: 'Innovation Committee with Finance and the senior education governance sponsor',
                decisionNeededBy: 'Before final commissioning decisions are issued in March 2027',
                confidence: 'indicative',
                riskIfMissing: 'King\'s could identify preferred convenors and projects without being able to offer credible protected capacity or direct project support.'
              },
              {
                condition: 'Secure written faculty or organisational commitment in principle for the release, workload allocation or backfill route attached to every selected convenor and project.',
                owner: 'Faculty education leadership and relevant organisational sponsors',
                decisionNeededBy: 'Before each appointment or project is finally commissioned',
                confidence: 'developing',
                riskIfMissing: 'Central funding may be reserved but the selected activity may remain impossible to accommodate locally.'
              },
              {
                condition: 'Constitute panels with appropriate expertise, representation, delegated authority and conflict-of-interest controls.',
                owner: 'SCoP Portfolio Lead with the Innovation Committee',
                decisionNeededBy: 'Before applications are assessed',
                confidence: 'developing',
                riskIfMissing: 'The process may be perceived as predetermined, particularly where informal mobilisation leads or incoming convenors are also applicants.'
              },
              {
                condition: 'Publish clear call documentation, applicant support and a timetable capable of reaching final commissioning decisions by the end of March 2027.',
                owner: 'SCoP Portfolio Lead and Portfolio Coordinator',
                decisionNeededBy: 'Before the January 2027 calls open',
                confidence: 'developing',
                riskIfMissing: 'Applications may be weak, uneven or too late to support the September operating cycle.'
              }
            ]
          };

          step.decisions = [
            {
              title: 'Confirm the convenor and project call model',
              summary: 'Approve the linked but distinct call specifications, eligibility, assessment criteria, selection panels, conflict controls, timetable and applicant-support arrangements before launch.'
            },
            {
              title: 'Confirm the protected-capacity and direct-cost offer',
              summary: 'Approve the offer of 0.1 FTE per community for two-year convenor appointments, approximately five annual 0.1 FTE project allocations and up to £1,000 direct expenditure per project, with actual use beginning through Step 7.'
            },
            {
              title: 'Approve the funded convenors',
              summary: 'Approve one or two convenors for each of the three communities, subject to written faculty or organisational commitment in principle and completion of the identified April-August conditions.'
            },
            {
              title: 'Approve the practice-based project portfolio',
              summary: 'Approve approximately five projects as a coherent annual portfolio, including any reserve list, conditions, cross-community coordination or decision not to allocate the full envelope.'
            }
          ];

          step.risks = [
            {
              title: 'Informal mobilisation leads are perceived as pre-selected',
              mitigation: 'Use an open process, published criteria, independently constituted panels and explicit conflict management, while recognising pilot experience only as evidence available equally through the assessment process.'
            },
            {
              title: 'Faculty or organisational support is nominal rather than implementable',
              mitigation: 'Require written commitment in principle and a named local owner before final commissioning, with explicit summer deadlines for completing workload or backfill arrangements.'
            },
            {
              title: 'Convenor and project selections do not form a coherent portfolio',
              mitigation: 'Select preferred convenors before final project decisions, invite proportionate advice on community fit, and retain independent portfolio-level decision-making through the Innovation Committee.'
            },
            {
              title: 'The first calls produce weak or uneven applications',
              mitigation: 'Provide briefings and proposal-development support, preserve the option not to allocate all funding, use a reserve list and run a targeted second-stage process where necessary.'
            },
            {
              title: 'Commissioning confirmations remain too conditional for applicants to plan',
              mitigation: 'Do not describe the cycle as commissioned until funding authority, written local commitment, named implementation owners and deadlines are in place.'
            },
            {
              title: 'Funded leadership displaces the goodwill and distributed participation that formed the communities',
              mitigation: 'Define convening as enabling and connecting rather than owning the community, use Step 4 continuity material and plan a sensitive handover from informal mobilisation leadership.'
            },
            {
              title: 'Project funding becomes a general research-grant scheme or substitutes for ordinary business',
              mitigation: 'Require a clear practice-based contribution to one or more communities, additionality to existing responsibilities and tangible educational practice, collaboration or institutional learning.'
            }
          ];

          step.assumptions = [
            {
              title: 'Community-level convenor capacity',
              summary: 'The 0.1 FTE allocation applies to each community rather than to each individual convenor and may be divided between one or two appointed convenors.'
            },
            {
              title: 'Project-level protected capacity',
              summary: 'The 0.1 FTE allocation applies to each project rather than to each person involved, may be divided across a small team and will be validated through the relevant workload model.'
            },
            {
              title: 'Annual project commissioning and two-year convenor terms',
              summary: 'Practice-based projects are commissioned for one academic-year cycle, while convenors are appointed for two academic years subject to satisfactory annual review.'
            },
            {
              title: 'Delivery investment begins in Step 7',
              summary: 'Step 5 approves and reserves the future resource commitment. Convenor capacity, project release or backfill and direct project expenditure become operational from September 2027 and are recorded as delivery resource in Step 7 rather than duplicated here.'
            }
          ];

          const ids = data.steps.map((item) => item.id);
          if (new Set(ids).size !== ids.length) throw new Error('Duplicate step IDs');
          const idSet = new Set(ids);
          for (const candidate of data.steps) {
            for (const dependency of candidate.dependsOn || []) {
              if (!idSet.has(dependency)) throw new Error(`Invalid dependency ${dependency} on ${candidate.id}`);
            }
          }
          if (JSON.stringify(step.dependsOn) !== JSON.stringify(['1.4.2-step-2'])) throw new Error('Step 5 dependency changed unexpectedly');
          if (step.resources.newInvestment.length !== 0) throw new Error('Step 5 must not carry delivery investment');
          if (step.outputs.length !== 5) throw new Error('Step 5 should have five developed outputs');
          if (!step.summary.includes('informal coalescing, professional goodwill and enthusiasm')) throw new Error('Step 5 sustainability transition is missing');
          if (!step.summary.includes('approximately five practice-based projects')) throw new Error('Step 5 project model is missing');

          fs.writeFileSync(path, JSON.stringify(data));
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Validate and build
        run: npm run build

      - name: Commit developed Step 5
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/data/deliverables/1.4.2/steps.json
          git commit -m "Develop SCoP commissioning step"
          git push origin HEAD:content/1-4-2-develop-step-5
