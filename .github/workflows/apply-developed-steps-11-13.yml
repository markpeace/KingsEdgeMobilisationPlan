            { title: 'Close mobilisation', summary: 'Confirm that temporary mobilisation arrangements can end and that all residual actions and risks have been accepted by named BAU owners.' }
          ];
          step13.risks = [
            { title: 'The handover changes labels but not real ownership', mitigation: 'Require named protected roles, delegated authority, budgets, systems access and acceptance of live records before closure.' },
            { title: 'Temporary mobilisation support is removed too early', mitigation: 'Use staged handover, retain short defined overlap where necessary and close temporary arrangements only after operational readiness is evidenced.' },
            { title: 'The first BAU year is disrupted by simultaneous transition and operation', mitigation: 'Commission and prepare the 2029-30 portfolio through Step 11, approve the settlement through Step 12 and use standard readiness checks before September.' },
            { title: 'Annual processes drift after programme closure', mitigation: 'Enter the full rhythm into institutional calendars, assign recurring owners and schedule the first BAU assurance review before closure.' },
            { title: 'Knowledge or access remains personal to individuals', mitigation: 'Complete the records and systems inventory, transfer ownership and test access before accepting the handover.' },
            { title: 'Future strategic relevance is not revisited', mitigation: 'Retain annual evidence review and schedule a later strategic review of themes, scale and alignment with the Education Delivery Framework.' }
          ];
          step13.assumptions = [
            { title: 'Step 12 approval is complete', summary: 'Step 13 executes an approved model and does not reopen the permanent policy or resource settlement.' },
            { title: 'King\'s Academy is the permanent institutional owner', summary: 'The portfolio is embedded within King\'s Academy with governance through the Innovation Committee and senior education routes.' },
