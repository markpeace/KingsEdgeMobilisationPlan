            { title: 'No new investment is created by transition', summary: 'Step 13 activates the recurrent commitments approved and recorded through earlier steps rather than adding another layer of cost.' }
          ];

          const ids = data.steps.map((item) => item.id);
          const idSet = new Set(ids);
          if (idSet.size !== ids.length) throw new Error('Duplicate step IDs');
          for (const candidate of data.steps) {
            for (const dependency of candidate.dependsOn || []) {
              if (!idSet.has(dependency)) throw new Error(`Invalid dependency ${dependency} on ${candidate.id}`);
            }
          }
          if (JSON.stringify(step11.dependsOn) !== JSON.stringify(['1.4.2-step-9'])) throw new Error('Step 11 dependencies incorrect');
          if (JSON.stringify(step12.dependsOn) !== JSON.stringify(['1.4.2-step-10', '1.4.2-step-11'])) throw new Error('Step 12 dependencies incorrect');
          if (JSON.stringify(step13.dependsOn) !== JSON.stringify(['1.4.2-step-12'])) throw new Error('Step 13 dependencies incorrect');
          if (![step11, step12, step13].every((step) => step.outputs.length === 5)) throw new Error('Each developed step should have five outputs');
          if (step11.resources.newInvestment.length !== 0) throw new Error('Step 11 should not duplicate operating investment');
          if (step12.resources.newInvestment.find((item) => item.id === '1.4.2-step-12-resource-investment-1')?.fte !== 0.6) throw new Error('Step 12 convenor FTE incorrect');
          if (step12.resources.newInvestment.find((item) => item.id === '1.4.2-step-12-resource-investment-2')?.fte !== 0.5) throw new Error('Step 12 project FTE incorrect');
          const permanentDirect = step12.resources.newInvestment.find((item) => item.id === '1.4.2-step-12-resource-investment-3');
          if (permanentDirect?.amount !== 5000 || permanentDirect?.bauLiability !== true) throw new Error('Step 12 permanent project allowance incorrect');
          if (step13.resources.newInvestment.length !== 0) throw new Error('Step 13 should activate rather than duplicate permanent investment');

          fs.writeFileSync(path, JSON.stringify(data));
