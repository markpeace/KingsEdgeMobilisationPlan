name: Develop SCoP Steps 11 to 13

on:
  push:
    branches:
      - content/1-4-2-develop-steps-11-13
    paths:
      - .github/workflows/apply-developed-steps-11-13.yml

permissions:
  contents: write

jobs:
  update-steps-11-13:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/1-4-2-develop-steps-11-13

      - name: Develop Steps 11 to 13
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/data/deliverables/1.4.2/steps.json';
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));
          const getStep = (id) => {
            const step = data.steps.find((item) => item.id === id);
            if (!step) throw new Error(`${id} not found`);
            return step;
          };

          const step11 = getStep('1.4.2-step-11');
          step11.title = 'Commission the 2029-30 portfolio and prepare institutional handover';
          step11.period = { start: 'jan-jun-2029:a', end: 'jan-jun-2029:b' };
          step11.stepType = 'final-mobilisation-commissioning-and-handover-preparation';
          step11.dependsOn = ['1.4.2-step-9'];
          step11.summary = `From January to March 2029, commission the Strategic Communities of Practice portfolio for the academic year beginning in September 2029 and prepare the operating model for institutional handover. Appoint one or two funded convenors for the next two-year term of the original Experiential Learning, AI in Education and Inclusive Education communities, covering 2029-30 and 2030-31. The convenors of the three additional communities appointed through Step 8 remain in post for the second year of their 2028-30 terms and are not routinely recommissioned. Commission approximately five practice-based projects across the full six-community portfolio for 2029-30, using available evidence from the live Step 10 cycle without making completion of that cycle a prerequisite. Secure written faculty or organisational commitments and reserve the protected-capacity and direct-cost resources needed from September 2029. Complete the April-August succession, onboarding and readiness route, and assemble the governance, budget, process, records and ownership material required for the permanent model to transfer into King's Academy after the Step 12 decision. This step commissions and prepares the first portfolio that will operate under business-as-usual arrangements; the permanent settlement itself is confirmed through Step 12 and activated through Step 13.`;
          step11.outputs = [
            {
              id: '1.4.2-step-11-output-1',
              title: '2029-31 convenors commissioned for the original three communities',
              type: 'funded-community-leadership',
              owner: 'Innovation Committee on the recommendation of the convenor selection panel',
              summary: 'One or two convenors commissioned for the next two-year term of each original community, with transparent treatment of incumbents and credible local protected-capacity commitments.',
              acceptanceCriteria: [
                'Experiential Learning, AI in Education and Inclusive Education each have one or two approved convenors for September 2029 to August 2031.',
                'Serving convenors may apply, but continuation is not automatic and the selection process considers both performance evidence and the published criteria for the next term.',
                'Each community retains a shared protected-capacity envelope equivalent to 0.1 FTE, divided explicitly where two convenors are appointed.',
                'Selection considers distributed leadership, community-building capability, institutional breadth, strategic judgement, inclusive practice, delivery and evidence of contribution during the first funded term.',
                'The relevant faculty or organisational area confirms in writing the route through which release, workload allocation or backfill will be enabled from September 2029.',
                'The three additional convenor teams remain in post for the second year of their Step 8 appointments and are included only where an exceptional vacancy or documented leadership change requires action.',
                'Incumbent performance review, applicant assessment and formal decision rights are kept distinct and conflicts are managed transparently.'
              ]
