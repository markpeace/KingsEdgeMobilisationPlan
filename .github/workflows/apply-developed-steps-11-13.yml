                'The £24,000 annual community activity allowance and £5,000 annual direct project-cost allowance are approved, or any revised amounts are justified by evidence.',
                'Final cash values for convenor and project release, workload allocation or backfill are calculated using the approved grades and implementation routes rather than remaining as indefinite planning proxies.',
                'A permanent budget holder, funding source, cost-centre structure, approval route, monitoring process and treatment of underspend are agreed.',
                'Previously recorded recurrent liabilities for central support and community activity are confirmed rather than entered again as additional costs.',
                'Any increase or reduction from the established model is recorded explicitly with its recurrent financial effect and delivery consequence.',
                'The settlement is approved in time for Step 13 to activate budgets and responsibilities from September 2029.'
              ]
            },
            {
