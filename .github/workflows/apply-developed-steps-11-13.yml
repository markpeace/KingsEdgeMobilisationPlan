                'The additional three communities continue through their second convenor year without unnecessary disruption.',
                'Cross-community relationships, shared projects and portfolio commitments are included in succession planning.',
                'No community remains dependent on undocumented personal knowledge held by a single convenor or by Mark Peace.'
              ]
            },
            {
              id: '1.4.2-step-11-output-5',
              title: 'Institutional handover pack prepared',
              type: 'business-as-usual-readiness-pack',
              owner: "King's Academy SCoP Portfolio Lead and Portfolio Coordinator",
