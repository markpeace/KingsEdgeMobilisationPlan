              type: 'commissioning-commitment-and-readiness-plan',
              owner: "King's Academy SCoP Portfolio Lead and Portfolio Coordinator with faculties and Finance",
              summary: 'The local, financial and operational commitments required for a credible September 2029 start are secured and assigned through an April-August preparation route.',
              acceptanceCriteria: [
                'Written faculty or organisational commitment is secured for every commissioned convenor and project requiring release, workload allocation or backfill.',
                'Resource authority is reserved for 0.6 FTE of convenor capacity, approximately 0.5 FTE of annual project capacity and up to £5,000 of direct project expenditure from September 2029.',
