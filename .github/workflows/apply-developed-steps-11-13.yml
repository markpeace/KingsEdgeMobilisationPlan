          step13.dependsOn = ['1.4.2-step-12'];
          step13.summary = `From September to December 2029, execute the transition of the Strategic Communities of Practice portfolio into business as usual using the permanent model and resource settlement approved through Step 12. Activate King's Academy as the accountable institutional owner, put the permanent Portfolio Lead and Portfolio Coordinator arrangements into effect, transfer budgets, records, systems, governance and decision rights, and retire temporary mobilisation dependencies. Begin the 2029-30 operating cycle under the permanent arrangements: the original three communities enter the first year of their Step 11 convenor terms, the additional three communities enter the second year of their Step 8 terms, and the commissioned annual project portfolio begins delivery. Embed the recurring annual calendar, including the 2030-31 calls launched through Step 12 and the first BAU commissioning window from January to March 2030. Complete knowledge transfer from Mark Peace and other mobilisation contributors, close residual mobilisation actions or assign them into ordinary governance, and schedule the first BAU assurance review. Step 13 does not redesign or re-cost the model; it makes the approved settlement operational and closes the mobilisation programme.`;
