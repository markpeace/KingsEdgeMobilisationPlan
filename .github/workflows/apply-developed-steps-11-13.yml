                'The annual rhythm is confirmed: September-June operation, July-August review and call launch, January-March commissioning, and April-August onboarding and readiness.',
                'Permanent ownership sits clearly within King\'s Academy, with defined roles for the Portfolio Lead, Portfolio Coordinator, convenors, project leads, Innovation Committee, faculties and senior education governance.',
                'Decision rights, delegated authority, conflict controls, escalation, annual reporting and routes into the Education Delivery Framework are approved.',
