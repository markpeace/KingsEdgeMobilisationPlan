                'The staggered two-year convenor cycle and annual project cycle are represented clearly, including which community cohort is recruited in each year.',
                'The pack includes the cumulative resource model, existing recurrent commitments, resource elements still requiring final cash valuation and the proposed budget-holder arrangements.',
                'Records, templates, data sources, systems, access requirements, risk and issue logs, decision history and open actions are inventoried.',
                'Responsibilities are clear across the Portfolio Lead, Portfolio Coordinator, convenors, project leads, Innovation Committee, faculties and senior education governance.',
