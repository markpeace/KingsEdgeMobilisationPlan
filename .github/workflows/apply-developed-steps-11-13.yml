            {
              id: '1.4.2-step-11-output-2',
              title: '2029-30 practice-based project portfolio commissioned',
              type: 'funded-project-portfolio',
              owner: 'Innovation Committee on the recommendation of the project selection panel',
              summary: 'Approximately five practice-based projects commissioned across all six communities for delivery from September 2029.',
              acceptanceCriteria: [
                'Approximately five projects are selected as one quality-led portfolio across all six communities, without guaranteed allocation by theme.',
                'Each project is connected to one or more communities and to a defined strategic education priority, challenge or opportunity.',
                'Each project has a named King\'s lead, delivery team, intended beneficiaries, practical outputs, timetable, evidence approach, budget and preparation route.',
                'Each project is offered an indicative 0.1 FTE protected-capacity envelope for one academic year, divisible across a small team, plus up to £1,000 of eligible direct delivery costs.',
                'Projects are additional to ordinary business, remain practice-based and do not become disconnected research projects or substitutes for established responsibilities.',
