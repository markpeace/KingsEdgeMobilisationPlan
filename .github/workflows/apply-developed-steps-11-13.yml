          step12.summary = `From July to August 2029, complete the formal review of the first full six-community operating cycle and confirm the permanent Strategic Communities of Practice model. Use the Step 10 portfolio account and the Step 11 commissioning and handover-readiness evidence to assess reach, participation, distributed leadership, practice development and spread, institutional influence, student-facing contribution, project delivery, expenditure, workload implementation, governance, support demand and differences in community maturity. Confirm or refine the six-community scale, staggered two-year convenor model, annual portfolio of approximately five practice-based projects, common reach and impact framework, annual operating rhythm and the role of King's Academy and the Innovation Committee. Approve the permanent recurrent resource settlement, including the 0.2 FTE Portfolio Lead, 0.4 FTE Portfolio Coordinator, 0.6 FTE convenor envelope, approximately 0.5 FTE annual project envelope, £24,000 annual community activity allowance and £5,000 annual direct project-cost allowance, with grade-based cash values and budget ownership confirmed before handover. Launch the 2030-31 annual project call across all six communities and the next convenor call for the three additional communities, whose first terms end in August 2030. Approve the institutional handover pack and the conditions through which Step 13 will activate business-as-usual ownership from September 2029.`;
