                'Differences in community maturity are recognised, but persistent weak viability, non-delivery or unsupported claims are addressed rather than excused.',
                'The review identifies material variation, concentration, participation gaps, underspend, overextension, cross-community duplication and opportunities for collaboration.',
                'Recovery, continuation, re-scope, leadership change or closure decisions are made where evidence requires them.',
                'The evidence is sufficient to support an institutional decision about the permanent model and its recurrent resources.'
              ]
            },
