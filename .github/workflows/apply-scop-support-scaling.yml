name: Apply SCoP support scaling update

on:
  push:
    branches:
      - content/1-4-2-scale-support-at-reviews
    paths:
      - .github/workflows/apply-scop-support-scaling.yml

permissions:
  contents: write

jobs:
  patch-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/1-4-2-scale-support-at-reviews

      - name: Patch SCoP support resources
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/data/deliverables/1.4.2/steps.json';
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));
          const step = (id) => {
            const value = data.steps.find((entry) => entry.id === id);
            if (!value) throw new Error(`Missing ${id}`);
            return value;
          };
          const ensureResources = (value) => {
            value.resources ||= {};
            value.resources.existingCapacity ||= [];
            value.resources.newInvestment ||= [];
            value.resources.enablingConditions ||= [];
          };
          const upsertById = (items, item) => {
            const index = items.findIndex((entry) => entry.id === item.id);
            if (index >= 0) items[index] = item;
            else items.push(item);
          };
          const appendSentence = (value, sentence) => {
            if (!value.summary.includes(sentence)) value.summary = `${value.summary} ${sentence}`;
          };

          const step2 = step('1.4.2-step-2');
          ensureResources(step2);
          step2.resources.existingCapacity = step2.resources.existingCapacity.filter(
            (entry) => entry.role !== "King's Academy SCoP Portfolio Lead design and shadowing capacity"
          );
          upsertById(step2.resources.newInvestment, {
            id: '1.4.2-step-2-resource-investment-3',
            item: "King's Academy SCoP Portfolio Lead workload release or backfill",
            category: 'permanent portfolio leadership',
            amount: 10000,
            currency: 'GBP',
            bauLiability: true,
            fundingRoute: 'TBC',
            fundingStatus: 'unconfirmed',
            owner: "King's Academy",
            periodNeeded: 'From September 2026 onward',
            decisionNeededBy: 'Before September 2026 mobilisation activity begins',
            confidence: 'indicative',
            rationale: "Provides an initial 0.1 FTE of protected senior capacity for a named King's Academy colleague to work alongside Mark Peace, take increasing ownership of the SCoP portfolio, support and challenge convenors, maintain strategic coherence and lead review and renewal. The £10,000 annual planning envelope should be recalculated against the named colleague's grade and the agreed release or backfill route.",
            riskIfMissing: "Permanent ownership would remain with Mark Peace by default or depend on unprotected goodwill, making the model difficult to sustain as convenors change and the portfolio expands.",
            fte: 0.1
          });
          const ownershipOutput = step2.outputs.find((entry) => entry.id === '1.4.2-step-2-output-6');
          if (ownershipOutput) {
            ownershipOutput.acceptanceCriteria = ownershipOutput.acceptanceCriteria.filter(
              (criterion) => !criterion.startsWith('The recurrent workload-release or backfill requirement for the Portfolio Lead')
            );
            if (!ownershipOutput.acceptanceCriteria.includes("Initial Portfolio Lead capacity of 0.1 FTE is costed as a recurrent BAU liability, with future increases considered through the formal review steps.")) {
              ownershipOutput.acceptanceCriteria.push("Initial Portfolio Lead capacity of 0.1 FTE is costed as a recurrent BAU liability, with future increases considered through the formal review steps.");
            }
          }
          step2.resources.enablingConditions = step2.resources.enablingConditions.filter(
            (entry) => !entry.condition.startsWith("Agree a route to quantify and fund the recurrent King's Academy workload-release or backfill requirement")
          );
          step2.resources.enablingConditions.push({
            condition: "Confirm the funding and release or backfill route for the initial 0.1 FTE King's Academy SCoP Portfolio Lead capacity.",
            owner: "King's Academy",
            decisionNeededBy: 'Before September 2026 mobilisation activity begins',
            confidence: 'developing',
            riskIfMissing: "The transfer of ownership from Mark Peace would begin without protected capacity and could become unsustainable before the first formal review."
          });

          const step7 = step('1.4.2-step-7');
          ensureResources(step7);
          appendSentence(step7, "As part of the review, assess the workload required for King's Academy portfolio leadership and administration and decide whether to release the planned additional capacity for the first funded three-community cycle.");
          upsertById(step7.resources.newInvestment, {
            id: '1.4.2-step-7-resource-investment-1',
            item: "Additional King's Academy SCoP Portfolio Lead capacity for the three-community cycle",
            category: 'permanent portfolio leadership',
            amount: 10000,
            currency: 'GBP',
            bauLiability: true,
            fundingRoute: 'TBC',
            fundingStatus: 'unconfirmed',
            owner: "King's Academy",
            periodNeeded: 'From September 2027 onward',
            decisionNeededBy: 'By the end of August 2027',
            confidence: 'indicative',
            rationale: "Adds 0.1 FTE of recurrent Portfolio Lead capacity, taking the role from 0.1 to 0.2 FTE if the initial mobilisation review confirms that this is required to own and support the first funded three-community cycle.",
            riskIfMissing: "The Portfolio Lead may not have sufficient protected capacity to support convenors, maintain coherence and lead the annual portfolio cycle.",
            fte: 0.1
          });
          upsertById(step7.resources.newInvestment, {
            id: '1.4.2-step-7-resource-investment-2',
            item: "Additional King's Academy SCoP Portfolio Coordinator capacity for the three-community cycle",
            category: 'permanent portfolio administration',
            amount: 11000,
            currency: 'GBP',
            bauLiability: true,
            fundingRoute: 'TBC',
            fundingStatus: 'unconfirmed',
            owner: "King's Academy",
            periodNeeded: 'From September 2027 onward',
            decisionNeededBy: 'By the end of August 2027',
            confidence: 'indicative',
            rationale: "Adds 0.2 FTE of recurrent portfolio coordination, taking the role from 0.2 to 0.4 FTE if the review confirms that this is required to administer the first funded three-community cycle.",
            riskIfMissing: "Annual calls, committee support, onboarding, reporting and portfolio records may exceed the capacity established during mobilisation.",
            fte: 0.2
          });
          upsertById(step7.outputs, {
            id: '1.4.2-step-7-output-4',
            title: 'Support capacity agreed for the first funded cycle',
            type: 'resource-review',
            owner: "King's Academy with Mark Peace",
            summary: "An evidence-based decision on whether to increase permanent portfolio leadership and coordination capacity for the first funded three-community cycle.",
            acceptanceCriteria: [
              'The actual leadership and administrative workload from initial mobilisation is reviewed.',
              'The need for the planned increase to 0.2 FTE Portfolio Lead and 0.4 FTE Portfolio Coordinator capacity is confirmed, amended or declined.',
              'Any approved incremental recurrent funding is in place for September 2027.'
            ]
          });

          const step11 = step('1.4.2-step-11');
          ensureResources(step11);
          appendSentence(step11, "As part of the review, assess the workload required for the expanded six-community portfolio and decide whether to release the final planned increments in permanent King's Academy leadership and administration.");
          upsertById(step11.resources.newInvestment, {
            id: '1.4.2-step-11-resource-investment-1',
            item: "Additional King's Academy SCoP Portfolio Lead capacity for the six-community portfolio",
            category: 'permanent portfolio leadership',
            amount: 10000,
            currency: 'GBP',
            bauLiability: true,
            fundingRoute: 'TBC',
            fundingStatus: 'unconfirmed',
            owner: "King's Academy",
            periodNeeded: 'From September 2028 onward',
            decisionNeededBy: 'By the end of August 2028',
            confidence: 'indicative',
            rationale: "Adds a further 0.1 FTE of recurrent Portfolio Lead capacity, taking the role from 0.2 to 0.3 FTE if the funded-cycle review confirms that this is required for the six-community portfolio.",
            riskIfMissing: "Strategic oversight, convenor support and cross-community learning may become too thin as the portfolio doubles in size.",
            fte: 0.1
          });
          upsertById(step11.resources.newInvestment, {
            id: '1.4.2-step-11-resource-investment-2',
            item: "Additional King's Academy SCoP Portfolio Coordinator capacity for the six-community portfolio",
            category: 'permanent portfolio administration',
            amount: 11000,
            currency: 'GBP',
            bauLiability: true,
            fundingRoute: 'TBC',
            fundingStatus: 'unconfirmed',
            owner: "King's Academy",
            periodNeeded: 'From September 2028 onward',
            decisionNeededBy: 'By the end of August 2028',
            confidence: 'indicative',
            rationale: "Adds a further 0.2 FTE of recurrent portfolio coordination, taking the role from 0.4 to 0.6 FTE if the review confirms that this is required to administer the six-community portfolio.",
            riskIfMissing: "The expanded annual cycle, committee workload, records, reporting and convenor handovers may not be administered reliably.",
            fte: 0.2
          });
          upsertById(step11.outputs, {
            id: '1.4.2-step-11-output-3',
            title: 'Support capacity agreed for the six-community portfolio',
            type: 'resource-review',
            owner: "King's Academy with Mark Peace",
            summary: "An evidence-based decision on whether to increase permanent portfolio leadership and coordination capacity for the expanded six-community portfolio.",
            acceptanceCriteria: [
              'The actual workload from the first funded three-community cycle is reviewed.',
              'The need for the planned increase to 0.3 FTE Portfolio Lead and 0.6 FTE Portfolio Coordinator capacity is confirmed, amended or declined.',
              'Any approved incremental recurrent funding is in place for September 2028.'
            ]
          });

          const step15 = step('1.4.2-step-15');
          appendSentence(step15, "Use evidence from the operating cycles to confirm or adjust the cumulative recurrent King's Academy portfolio leadership and administration settlement, without counting investment already introduced through earlier steps a second time.");
          step15.outputs ||= [];
          upsertById(step15.outputs, {
            id: '1.4.2-step-15-output-3',
            title: 'Confirmed permanent SCoP support settlement',
            type: 'bau-resource-settlement',
            owner: "King's Academy with the agreed governance route",
            summary: "The final recurrent leadership and administrative capacity for the permanent SCoP portfolio, confirmed or amended using evidence from mobilisation and funded operating cycles.",
            acceptanceCriteria: [
              'The final Portfolio Lead and Portfolio Coordinator workload assumptions are agreed from evidence of actual demand.',
              'Grades or backfill routes, recurrent costs, institutional owner and budget holder are confirmed.',
              'The settlement explicitly recognises the recurrent liabilities introduced in Steps 2, 7 and 11 and does not count them again as new investment.'
            ]
          });

          fs.writeFileSync(path, JSON.stringify(data));
          NODE

      - name: Commit patched plan
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/data/deliverables/1.4.2/steps.json
          git commit -m "Scale SCoP support through review decisions"
          git push origin HEAD:content/1-4-2-scale-support-at-reviews
