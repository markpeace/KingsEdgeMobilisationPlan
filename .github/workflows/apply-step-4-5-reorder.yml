name: Apply Step 4 and Step 5 reorder

on:
  push:
    branches:
      - content/1-4-2-swap-steps-4-and-5
    paths:
      - .github/workflows/apply-step-4-5-reorder.yml

permissions:
  contents: write

jobs:
  reorder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/1-4-2-swap-steps-4-and-5

      - name: Swap Step 4 and Step 5 and update references
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/data/deliverables/1.4.2/steps.json';
          const source = JSON.parse(fs.readFileSync(path, 'utf8'));

          const swapString = (value) => value
            .replaceAll('1.4.2-step-4', '__STEP_4_ID__')
            .replaceAll('1.4.2-step-5', '1.4.2-step-4')
            .replaceAll('__STEP_4_ID__', '1.4.2-step-5')
            .replace(/\bStep 4\b/g, '__STEP_4_TEXT__')
            .replace(/\bStep 5\b/g, 'Step 4')
            .replace(/__STEP_4_TEXT__/g, 'Step 5');

          const swapReferences = (value) => {
            if (typeof value === 'string') return swapString(value);
            if (Array.isArray(value)) return value.map(swapReferences);
            if (value && typeof value === 'object') {
              return Object.fromEntries(
                Object.entries(value).map(([key, child]) => [key, swapReferences(child)])
              );
            }
            return value;
          };

          const data = swapReferences(source);
          const step4Index = data.steps.findIndex((step) => step.id === '1.4.2-step-4');
          const step5Index = data.steps.findIndex((step) => step.id === '1.4.2-step-5');
          if (step4Index < 0 || step5Index < 0) {
            throw new Error('Could not find renumbered Step 4 and Step 5');
          }

          if (step4Index > step5Index) {
            const step4 = data.steps[step4Index];
            const step5 = data.steps[step5Index];
            data.steps[step5Index] = step4;
            data.steps[step4Index] = step5;
          }

          const step4 = data.steps.find((step) => step.id === '1.4.2-step-4');
          const step5 = data.steps.find((step) => step.id === '1.4.2-step-5');
          const step6 = data.steps.find((step) => step.id === '1.4.2-step-6');

          step5.dependsOn = ['1.4.2-step-2'];
          if (step6) step6.dependsOn = ['1.4.2-step-4', '1.4.2-step-5'];

          const ids = data.steps.map((step) => step.id);
          if (new Set(ids).size !== ids.length) throw new Error('Duplicate step IDs after reorder');
          if (step4.title !== 'Build the first three communities and establish their operating conventions') {
            throw new Error(`Unexpected Step 4 title: ${step4.title}`);
          }
          if (!step5.title.includes('funded convenor') || !step5.title.includes('community-project')) {
            throw new Error(`Unexpected Step 5 title: ${step5.title}`);
          }
          if (JSON.stringify(step5.dependsOn) !== JSON.stringify(['1.4.2-step-2'])) {
            throw new Error('Step 5 dependency was not reduced to Step 2');
          }

          fs.writeFileSync(path, JSON.stringify(data));
          NODE

      - name: Validate JSON
        run: node -e "const d=require('./src/data/deliverables/1.4.2/steps.json'); if(!Array.isArray(d.steps)) process.exit(1)"

      - name: Commit reordered steps
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/data/deliverables/1.4.2/steps.json
          git commit -m "Reorder community building and funded calls"
          git push origin HEAD:content/1-4-2-swap-steps-4-and-5
