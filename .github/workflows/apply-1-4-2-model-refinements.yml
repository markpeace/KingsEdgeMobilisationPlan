name: Apply 1.4.2 model refinements

on:
  push:
    branches:
      - content/1-4-2-refine-model-and-project-scale
    paths:
      - .github/workflows/apply-1-4-2-model-refinements.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/1-4-2-refine-model-and-project-scale

      - name: Apply agreed refinements
        run: |
          node <<'NODE'
          const fs = require('fs');
          const assert = require('assert');

          const overviewPath = 'src/data/deliverables/1.4.2/overview.json';
          const benefitsPath = 'src/data/deliverables/1.4.2/benefits.json';
          const measuresPath = 'src/data/deliverables/1.4.2/measures.json';
          const stepsPath = 'src/data/deliverables/1.4.2/steps.json';

          const overview = JSON.parse(fs.readFileSync(overviewPath, 'utf8'));
          const benefits = JSON.parse(fs.readFileSync(benefitsPath, 'utf8'));
          const measures = JSON.parse(fs.readFileSync(measuresPath, 'utf8'));
          const stepsData = JSON.parse(fs.readFileSync(stepsPath, 'utf8'));

          function cleanVocabulary(value) {
            if (Array.isArray(value)) return value.map(cleanVocabulary);
            if (value && typeof value === 'object') {
              for (const key of Object.keys(value)) value[key] = cleanVocabulary(value[key]);
              return value;
            }
            if (typeof value !== 'string') return value;
            return value
              .replace(/Innovation Subcommittee/g, 'Innovation Committee')
              .replace(/Innovation subcommittee/g, 'Innovation Committee')
              .replace(/\bconveners\b/g, 'convenors')
              .replace(/\bconvener\b/g, 'convenor')
              .replace(/agile shards/g, 'time-limited practice-based project teams')
              .replace(/community-project calls/g, 'practice-based project calls');
          }

          cleanVocabulary(overview);
          cleanVocabulary(benefits);
          cleanVocabulary(measures);
          cleanVocabulary(stepsData);

          overview.detailSummary = `Strategic Communities of Practice are institutionally recognised communities that sit between strategy and educational practice. Convened around selected priorities, which might initially include areas such as experiential learning, AI in education or inclusive education, they bring together academic and professional service educators, students and partners to develop shared understanding, connect ground-up innovation and co-own educational change. They provide a locus of energy and influence for educational leadership, while helping King’s develop greater collective resonance without imposing uniform solutions from the centre.

Each community combines a committed core with a wider, porous network, while time-limited practice-based project teams undertake focused work around particular challenges or opportunities. Through events, collaborative inquiry, commissioned activity, seed funding, showcases and wider outreach, communities engage colleagues beyond existing enthusiasts, test and evidence emerging ideas, and help effective practice travel across the institution. Workloaded convenors sustain the community, while an Innovation Committee provides strategic direction, commissioning authority and light-touch accountability. A deliberately simple operating toolkit keeps planning, decisions, evidence and annual review proportionate to the work.

The operating logic is explicit: protected convenor and portfolio capacity, accessible participation routes and community and project funding enable a broader range of educators—and, where relevant, students—to contribute and lead. That participation supports practice to be developed, tested and spread; creates credible evidence and collaborations; informs faculty and institutional decisions; and contributes over time to bounded improvements in educational provision, practice and student experience. Student partnership is proportionate to the theme and activity: students may participate as community members, paid or otherwise formally recognised project partners, or contributors to evidence and reflection, without creating a requirement that every community use the same model. The design also reduces reliance on discretionary time and existing networks so that leadership and funded opportunity are not confined to colleagues who already find institutional participation easiest.`;

          const b1 = benefits.benefits.find(b => b.id === '1.4.2-B1');
          const b2 = benefits.benefits.find(b => b.id === '1.4.2-B2');
          assert(b1 && b2, 'Expected benefits not found');
          b1.enabledBy = [
            'Protected convenor and portfolio capacity',
            'Accessible and equitable routes into participation and leadership',
            'Community activity funding and practice-based project investment'
          ];
          b1.successLooksLike = 'Educators regard the communities as consequential places in which to contribute and lead. Participation creates meaningful relationships, supported opportunities and funded activity, while educational expertise and innovation gain greater institutional visibility, influence and external reach. Participation and funded opportunity are accessible across roles, career stages and organisational contexts rather than concentrating among colleagues with the greatest discretionary time or strongest existing networks.';
          b2.enabledBy = [
            'Distributed educator and student contribution through the communities',
            'Practice developed, tested, evidenced and spread through community activity and projects',
            'Clear routes through which community insight reaches faculty and institutional decisions'
          ];
          b2.successLooksLike = 'Strategic educational priorities generate sustained institution-wide participation and purposeful action. Insight from practice informs strategy, governance and investment, while shared approaches are adopted and adapted across King’s because they have been developed collaboratively and are credible in different educational contexts. The evidence chain remains visible: participation and distributed leadership enable practice and collaboration; developed practice and evidence inform decisions; and those decisions and adoptions contribute to bounded student-facing educational change.';

          const m1 = measures.measures.find(m => m.id === '1.4.2-M1');
          const m2 = measures.measures.find(m => m.id === '1.4.2-M2');
          const m5 = measures.measures.find(m => m.id === '1.4.2-M5');
          assert(m1 && m2 && m5, 'Expected measures not found');
          m1.measure = 'For each community and across the portfolio, report unique active participants, repeat participants and the breadth of participation across faculties, professional-services areas and relevant role or career-stage groups. Report mailing-list membership and one-off attendance separately. Step 6 will define a proportionate threshold for active participation, drawing on attendance, contribution, collaboration, project involvement or other meaningful engagement rather than contact-list presence alone. Where proportionate and responsible, identify persistent access gaps or concentrations and the practical response, without creating intrusive personal-data collection.';
          m2.measure = 'Report the number and institutional breadth of people making substantive contributions through sharing or developing practice, facilitating or convening activity, leading or contributing to funded projects, producing outputs, mentoring others, forming collaborations or representing community insight in institutional work. Distinguish the small number of funded roles from the wider distribution of voluntary contribution and leadership enabled by them. Where students contribute as partners, record the nature and recognition of that contribution rather than counting student presence alone.';
          m5.measure = 'Use proportionate evidence chains and case studies to show how community-supported practice, projects, resources or institutional influence contributed to a student-facing change and what evidence suggests the change was useful. Evidence may include implementation and reach, student participation or feedback, educator judgement, service or curriculum change and relevant existing indicators. Where students have participated as partners, include their contribution and perspective proportionately. Do not require or claim direct causal movement in common student-outcome measures where the timeframe and evidence cannot support it.';

          const step = id => {
            const found = stepsData.steps.find(s => s.id === id);
            assert(found, `Missing ${id}`);
            return found;
          };
          const byTitle = (items, needle, label) => {
            const found = (items || []).find(item => (item.title || item.item || item.role || '').includes(needle));
            assert(found, `Missing ${label || needle}`);
            return found;
          };
          const output = (s, needle) => byTitle(s.outputs, needle, `${s.id} output ${needle}`);
          const decision = (s, needle) => byTitle(s.decisions, needle, `${s.id} decision ${needle}`);
          const risk = (s, needle) => byTitle(s.risks, needle, `${s.id} risk ${needle}`);
          const assumption = (s, needle) => byTitle(s.assumptions, needle, `${s.id} assumption ${needle}`);
          const investment = (s, needle) => byTitle(s.resources?.newInvestment, needle, `${s.id} investment ${needle}`);
          const capacity = (s, needle) => byTitle(s.resources?.existingCapacity, needle, `${s.id} capacity ${needle}`);
          const condition = (s, fragment) => {
            const found = (s.resources?.enablingConditions || []).find(item => (item.condition || '').includes(fragment));
            assert(found, `Missing ${s.id} condition ${fragment}`);
            return found;
          };
          const addUnique = (items, item) => {
            if (!items.some(existing => existing.id === item.id || existing.title === item.title)) items.push(item);
          };

          const s2 = step('1.4.2-step-2');
          s2.summary += ' Keep the model deliberately light in use: a one-page community proposition, annual calendar, decision-rights map, short community plan, proportionate project template, compact termly dashboard and concise annual portfolio account. Include practical principles for equitable access and proportionate student partnership, together with a lifecycle route for establishing, renewing, supporting, redefining, pausing or closing communities.';
          output(s2, 'Standard SCoP operating model').summary = 'A clear and reusable model defining how Strategic Communities of Practice are established, led, supported, operated, reviewed and renewed, including proportionate routes to support, redefine, pause, close or replace a community where evidence or strategic relevance requires it.';
          output(s2, 'Minimum expectations').summary = 'A proportionate baseline defining what every Strategic Community of Practice is expected to do and demonstrate while allowing communities to respond differently to their subject matter. Expectations include accessible participation, distributed leadership and proportionate student partnership where it adds material value.';
          output(s2, 'Workload-release and backfill proposition').summary = 'A credible institutional proposition for workload release, workload allocation or backfill for SCoP convenors and colleagues leading funded practice-based projects, designed so access does not depend on pre-existing discretionary time or local privilege.';
          addUnique(s2.outputs, {
            id: '1.4.2-step-2-output-7',
            title: 'Minimum viable SCoP operating toolkit',
            summary: 'A deliberately light set of reusable tools comprising a one-page community proposition, annual calendar, decision-rights map, short community plan, proportionate project template, compact termly dashboard and concise annual portfolio account.',
            type: 'operating toolkit',
            owner: 'King’s Academy SCoP Portfolio Lead and Portfolio Coordinator',
            acceptanceCriteria: [
              'The toolkit covers the minimum information needed for decisions, delivery, financial control, learning and assurance without duplicating the detailed mobilisation plan.',
              'Convenors and project leads can use the standard tools without creating parallel local reporting systems.'
            ]
          });
          addUnique(s2.risks, {
            id: '1.4.2-step-2-risk-6',
            title: 'The operating model becomes more burdensome than the communities it supports',
            description: 'Governance, commissioning and evidence requirements could consume the capacity intended for community leadership and practice development.',
            mitigation: 'Use the minimum viable toolkit, keep a small common evidence core, reuse routine records and require additional documentation only where investment, risk or a real decision justifies it.'
          });
          addUnique(s2.risks, {
            id: '1.4.2-step-2-risk-7',
            title: 'Leadership and funded opportunity concentrate among colleagues with the easiest access',
            description: 'Existing networks, seniority, discretionary time or local workload arrangements could shape who is able to participate and lead.',
            mitigation: 'Build equitable access into communications, applicant support, panel composition, workload commitments and participation design, then use the reach and leadership evidence to identify persistent gaps and respond proportionately.'
          });

          const s5 = step('1.4.2-step-5');
          s5.summary = 'From January to March 2027, move the Experiential Learning, AI in Education and Inclusive Education communities from an initial phase sustained largely through informal coalescing, professional goodwill and enthusiasm towards a more durable funded model for the 2027-28 academic year. Run an open call to identify and support a very small number of funded convenors who can provide consistent leadership across the three communities, normally one or two convenors per community appointed for two academic years. Alongside this, invite proposals for approximately five practice-based projects for each community—around fifteen projects in total—that advance community priorities and development, create useful activity, collaboration, outputs and institutional learning, and are not disconnected projects or a general research-grant scheme. Agree the successful convenors and project portfolio by the end of March, together with written faculty or organisational commitments in principle, the protected-capacity model, reserved funding authority, governance and reporting expectations, and the April-August preparation route required for activity to begin in September 2027. Relevant learning from the Step 4 pilots should inform the process and handover as it becomes available, but completion of the pilots is not a prerequisite for commissioning the funded cycle. The purpose is not to replace the energy, relationships and distributed participation through which the communities have formed, but to provide enough protected leadership and practical project support for that activity to become sustainable, purposeful and institutionally connected.';
          output(s5, 'First practice-based project portfolio commissioned').summary = 'Approximately fifteen practice-based projects commissioned, planned as around five connected to each of the three communities and managed as one coherent portfolio. Cross-community projects have one primary community and count once in the total.';
          condition(s5, 'Approve and reserve the resource envelope').condition = 'Approve and reserve the resource envelope that will become operational through Step 7: 0.1 FTE per community for convening, approximately fifteen 0.1 FTE annual project allocations and up to £1,000 direct expenditure per project, creating indicative annual envelopes of 0.3 FTE convenor capacity, 1.5 FTE project capacity and £15,000 direct project expenditure.';
          decision(s5, 'Confirm the protected-capacity and direct-cost offer').summary = 'Approve the offer of 0.1 FTE per community for two-year convenor appointments, approximately fifteen annual 0.1 FTE project allocations—around five per community—and up to £1,000 direct expenditure per project, with actual use beginning through Step 7.';
          decision(s5, 'Approve the practice-based project portfolio').summary = 'Approve approximately fifteen projects, planned as around five per community, using transparent criteria covering quality, feasibility, strategic relevance, community connection, additionality, potential for adoption or spread, equitable access and overall portfolio balance. Preserve the option not to fill an envelope or to reallocate where proposal quality or readiness does not support the intended volume.';
          risk(s5, 'The first calls produce weak or uneven applications').mitigation = 'Provide accessible briefings and proposal-development support, reach beyond established networks, preserve the option not to allocate all funding, use a reserve list and run a targeted second-stage process where necessary.';
          addUnique(s5.risks, {
            id: '1.4.2-step-5-risk-8',
            title: 'Five projects per community becomes an automatic entitlement or volume target',
            description: 'The planning envelope could encourage weak proposals, artificial quotas or projects created to use funding rather than meet a real practice need.',
            mitigation: 'Treat five per community as an indicative planning envelope, retain published quality and additionality thresholds, allow cross-community projects, count each project once through a primary community and leave or reallocate capacity where the evidence does not support an award.'
          });
          addUnique(s5.risks, {
            id: '1.4.2-step-5-risk-9',
            title: 'Project access reproduces existing inequalities',
            description: 'Opportunity may concentrate among well-networked colleagues or teams with the greatest discretionary capacity.',
            mitigation: 'Use broad promotion, proportionate applicant support, accessible processes, representative panels and credible local workload commitments. Ask proposals to explain student partnership where materially relevant and how student contribution will be paid or otherwise formally recognised.'
          });
          assumption(s5, 'Annual project commissioning and two-year convenor terms').summary = 'Practice-based projects are commissioned for one academic-year cycle, with an indicative planning envelope of around five projects for each community, while convenors are appointed for two academic years subject to satisfactory annual review.';
          assumption(s5, 'Project-level protected capacity').summary = 'The 0.1 FTE allocation applies to each project rather than to each person involved, may be divided across a small team and will be validated through the relevant workload model. Around fifteen projects therefore create an indicative 1.5 FTE annual project-capacity envelope for the first three-community cycle.';

          const s6 = step('1.4.2-step-6');
          s6.summary = 'From July to August 2027, review the initial mobilisation and pilot operation of the Experiential Learning, AI in Education and Inclusive Education communities together with the first process for commissioning funded convenors and approximately fifteen practice-based projects. Use this evidence to refine the operating, governance, commissioning and central-support arrangements before the portfolio expands, while recognising that the first funded operating cycle will not begin until September 2027 and therefore cannot yet be evaluated for delivery impact. Establish a proportionate success framework for reach and impact that can be used from the first funded cycle, drawing on the initial pilots to establish baselines where possible and agreeing portfolio expectations, evidence responsibilities and reporting arrangements. Include an equity lens that identifies persistent concentrations or access gaps without creating intrusive reporting. In parallel, look forward to the academic year beginning in September 2028. Review the Education Delivery Framework with the Vice President (Education and Student Success) and the Vice Deans Education to identify and agree the three additional education priorities around which the next Strategic Communities of Practice should be established. Use a concise set of criteria covering strategic relevance, distinctiveness, existing expertise and energy, institutional breadth, community viability and potential to develop practice and influence. Confirm the proposed six-community portfolio for 2028-29, the resource and central-support implications of expansion, and any refinements required to the convenor and practice-based project model. Launch the calls that will be commissioned between January and March 2028, allowing detailed preparation and community formation between April and August ahead of operation from September 2028. The call should seek funded convenors for the three additional communities and approximately five practice-based projects for each of the six communities—around thirty projects in total. Convenors appointed to the original three communities through Step 5 will normally remain in post for the second year of their two-academic-year term.';
          output(s6, 'Three additional strategic community themes agreed').summary = 'Three additional education priorities agreed as the basis for new Strategic Communities of Practice beginning in September 2028, using concise criteria covering strategic relevance, distinctiveness, existing expertise and energy, institutional breadth, viability and potential for practice development and influence.';
          output(s6, '2028-29 convenor and practice-based project calls launched').summary = 'Calls launched for convenors of the three additional communities and for approximately five practice-based projects for each of the planned six communities—around thirty projects in total—for commissioning through Step 8 between January and March 2028.';
          decision(s6, 'Agree the next three community themes').summary = 'Following review of the Education Delivery Framework, the Vice President (Education and Student Success) and Vice Deans Education approve three additional priorities using the agreed criteria for strategic relevance, distinctiveness, institutional breadth, viable founding participation and potential for practice development and influence.';
          decision(s6, 'Authorise the 2028-29 calls').summary = 'Approve launch of the convenor calls for the three additional communities and the annual practice-based project call with an indicative envelope of around five projects per community—around thirty across the planned six-community portfolio—for commissioning through Step 8.';
          assumption(s6, 'Projects continue as an annual portfolio').summary = 'Approximately five practice-based projects are commissioned annually for each community, creating an indicative portfolio of around fifteen projects across three communities and around thirty across six. Cross-community projects have one primary community and count once; quality and readiness remain more important than filling every envelope.';

          const s7 = step('1.4.2-step-7');
          s7.summary = 'From September 2027 to June 2028, operate the first fully funded Strategic Communities of Practice cycle across Experiential Learning, AI in Education and Inclusive Education. Bring the funded convenors appointed through Step 5 into their roles, activate the agreed release, workload-allocation or backfill arrangements, and deliver a visible programme of community activity aligned to the priorities of each community. Maintain the distributed participation and professional energy through which the communities originally formed, while using protected convenor capacity to provide continuity, connection, purposeful leadership and institutional influence. Deliver approximately fifteen practice-based projects—around five connected to each community—across the portfolio. Each project should use its protected capacity and direct-cost allowance to develop, test or spread useful educational practice, create collaboration and generate institutional learning rather than operating as a disconnected research project. Apply the common reach and impact framework established through Step 6, gathering proportionate evidence of active reach, distributed leadership, practice development and spread, institutional influence and student-facing educational impact. Use termly review points to identify where communities or projects need support, adaptation or escalation, and complete a year-end portfolio account by June 2028 to inform the formal operating-cycle review in Step 9. On the current planning assumptions, the full three-community annual operating model has an indicative cash-equivalent value of approximately £249,000, including continuing central support and community allowances.';
          output(s7, 'First funded practice-based project portfolio delivered').summary = 'Approximately fifteen funded projects delivered—around five connected to each community—each developing, testing or spreading useful educational practice and contributing to one or more communities.';
          Object.assign(investment(s7, 'Funded convenor protected capacity'), {
            amount: 30000,
            currency: 'GBP',
            fte: 0.3,
            confidence: 'indicative',
            estimatedCost: '£30,000 annual cash-equivalent, using £10,000 per 0.1 FTE as the current planning assumption',
            rationale: 'Activates 0.1 FTE of protected capacity for each of the three communities, shared where co-convenors have been appointed. The £30,000 cash-equivalent is a planning estimate and should be recalculated against named grades and the agreed release, allocation or backfill route.'
          });
          Object.assign(investment(s7, 'Protected capacity for the first annual practice-based project portfolio'), {
            amount: 150000,
            currency: 'GBP',
            fte: 1.5,
            confidence: 'indicative',
            estimatedCost: '£150,000 annual cash-equivalent, using £10,000 per 0.1 FTE project envelope',
            rationale: 'Activates an indicative 0.1 FTE protected-capacity envelope for each of approximately fifteen projects—around five per community—divisible across a small delivery team. The cash-equivalent is a planning estimate and should be recalculated against the actual grade mix and implementation route.'
          });
          Object.assign(investment(s7, 'Direct delivery costs for the first practice-based project portfolio'), {
            amount: 15000,
            currency: 'GBP',
            confidence: 'indicative',
            rationale: 'Provides up to £1,000 for each of approximately fifteen projects for eligible direct costs such as materials, small events, paid or otherwise formally recognised student partnership, accessibility, modest specialist input or dissemination.'
          });
          addUnique(s7.resources.enablingConditions, {
            id: '1.4.2-step-7-condition-5',
            condition: 'Community and project plans identify practical access barriers, use accessible participation routes and explain any material student-partnership role, including how student contribution will be paid or otherwise formally recognised.',
            whatItUnlocks: 'A funded cycle that broadens participation and uses student partnership purposefully rather than symbolically.'
          });
          assumption(s7, 'Project capacity is allocated per project').summary = 'Each commissioned project has an indicative 0.1 FTE protected-capacity envelope that may be divided across a small team, plus up to £1,000 of eligible direct delivery expenditure. Approximately fifteen projects create a 1.5 FTE and £15,000 direct-cost annual envelope.';
          addUnique(s7.assumptions, {
            id: '1.4.2-step-7-assumption-6',
            title: 'Projects are connected to a primary community',
            summary: 'The planning model provides around five projects for each community. Cross-community projects are encouraged where useful but have one primary community and count once in the approximately fifteen-project total.'
          });

          const s8 = step('1.4.2-step-8');
          s8.summary = 'From January to March 2028, commission the expanded Strategic Communities of Practice portfolio for the academic year beginning in September 2028. Appoint one or two funded convenors for each of the three additional community themes agreed through Step 6, for two academic years covering 2028-29 and 2029-30. The convenors of the original Experiential Learning, AI in Education and Inclusive Education communities remain in post for the second year of their Step 5 appointments and are not routinely recommissioned. Alongside this, commission approximately five practice-based projects for each of the six communities—around thirty projects in total—for delivery during 2028-29, using evidence from the live Step 7 cycle where it is available without making completion of that cycle a prerequisite. Secure written faculty or organisational commitments, reserve the protected-capacity and project resources required for September, and establish the April-August route through which the three new communities form founding networks, convenors are onboarded, projects are prepared and all six communities reach operational readiness. Approve the additional £12,000 annual recurrent base activity allowance required for the three new communities, bringing the six-community allowance to £24,000 from September 2028. In recognition of the move from three communities and around fifteen projects to six communities and around thirty projects, approve a further indicative 0.2 FTE Portfolio Lead and 0.4 FTE Portfolio Coordinator, bringing central support to 0.4 FTE and 0.8 FTE respectively from September 2028. Step 8 creates and records the commissioning commitments; convenor capacity, project capacity and direct project expenditure become operational through Step 10.';
          output(s8, '2028-29 practice-based project portfolio commissioned').summary = 'Approximately thirty practice-based projects commissioned, planned as around five connected to each of the six communities and managed as one coherent portfolio. Cross-community projects have one primary community and count once.';
          output(s8, 'Expansion commitments and resource reservations secured').summary = 'The appointments and projects move beyond preferred selections: the institutional, local and funding commitments required for a credible September 2028 start are secured, including the additional central capacity required to support six communities and around thirty annual projects.';
          addUnique(s8.resources.newInvestment, {
            id: '1.4.2-step-8-resource-investment-2',
            item: 'Further King’s Academy SCoP Portfolio Lead workload release or backfill',
            category: 'portfolio leadership capacity',
            amount: 20000,
            currency: 'GBP',
            fte: 0.2,
            bauLiability: true,
            owner: 'King’s Academy',
            fundingRoute: 'TBC',
            fundingStatus: 'indicative',
            confidence: 'indicative',
            rationale: 'Adds a further 0.2 FTE to the 0.2 FTE already established, creating an indicative 0.4 FTE Portfolio Lead for six communities and around thirty annual projects. The £20,000 annual estimate uses the existing £10,000 per 0.1 FTE planning assumption and must be recalculated against the named colleague’s grade and implementation route.',
            riskIfMissing: 'Strategic support, convenor development, portfolio coherence, evidence use and institutional influence will be spread too thinly across the expanded portfolio.'
          });
          addUnique(s8.resources.newInvestment, {
            id: '1.4.2-step-8-resource-investment-3',
            item: 'Further King’s Academy SCoP Portfolio Coordinator capacity',
            category: 'portfolio coordination capacity',
            amount: 22000,
            currency: 'GBP',
            fte: 0.4,
            bauLiability: true,
            owner: 'King’s Academy',
            fundingRoute: 'TBC',
            fundingStatus: 'indicative',
            confidence: 'indicative',
            rationale: 'Adds a further 0.4 FTE to the 0.4 FTE already established, creating an indicative 0.8 FTE Portfolio Coordinator for six communities, around thirty annual projects, calls, onboarding, budgets, governance, evidence and succession. The £22,000 annual estimate scales the existing £11,000 per 0.2 FTE planning assumption.',
            riskIfMissing: 'Annual commissioning, financial control, evidence, records and support to live communities will become unreliable at the expanded volume.'
          });
          condition(s8, 'Approve and reserve the protected-capacity and direct-cost envelope').condition = 'Approve and reserve the protected-capacity and direct-cost envelope that will become operational through Step 10: 0.6 FTE convenor capacity, approximately 3.0 FTE across around thirty annual projects and up to £30,000 direct project expenditure.';
          decision(s8, 'Approve the 2028-29 project portfolio').summary = 'Approve approximately thirty projects, planned as around five per community, including conditions, reserve arrangements, cross-community coordination and any evidence-based decision not to fill or to reallocate part of a community envelope.';
          risk(s8, 'Five projects across six communities create pressure for equal quotas').title = 'Five projects per community becomes an inflexible quota';
          risk(s8, 'Five projects per community becomes an inflexible quota').mitigation = 'Treat five as an indicative planning envelope, apply common quality and additionality thresholds, allow cross-community projects with one primary community, and preserve the option not to fill or to reallocate capacity where readiness or proposal quality does not support an award.';
          assumption(s8, 'Single annual project portfolio').summary = 'Approximately five projects are commissioned for each of the six communities—around thirty in total—within one quality-led portfolio. Cross-community projects have one primary community and count once; the planning envelope is not an obligation to fund weak proposals.';

          const s9 = step('1.4.2-step-9');
          s9.summary = 'From July to August 2028, complete the first formal review of a funded Strategic Communities of Practice operating cycle. Use the Step 7 year-end portfolio account to assess the performance of the Experiential Learning, AI in Education and Inclusive Education communities and their approximately fifteen practice-based projects against the reach and impact framework established through Step 6. Review active and sustained participation, distributed leadership, practice development and spread, institutional influence, student-facing contribution, project delivery, expenditure, workload arrangements, governance and variation between communities. Alongside this, review the Step 8 expansion commissioning and the readiness of the three additional communities for operation from September 2028. Agree proportionate refinements to the operating, support, evidence and commissioning model without judging early-stage communities against expectations that only mature communities could meet. Confirm that the six-community portfolio and expanded central support arrangements remain credible, then launch the 2029-30 annual practice-based project call with an indicative envelope of around five projects for each community—around thirty projects in total—and the next convenor call for the original three communities, whose first two-year appointments end in August 2029. Convenors appointed for the three additional communities through Step 8 remain in post for their second year and are not routinely asked to reapply.';
          output(s9, '2029-30 annual practice-based project call launched').summary = 'The next annual call launched for approximately five projects for each of the six communities—around thirty projects in total—for commissioning through Step 11 and delivery from September 2029.';
          decision(s9, 'Approve the 2029-30 call package').summary = 'Authorise the convenor call for the original three communities and the annual project call with an indicative envelope of around five projects per community—around thirty across all six communities.';
          assumption(s9, 'Project commissioning remains annual').summary = 'A fresh portfolio of approximately five projects per community—around thirty projects across six communities—is commissioned for each academic year, with quality thresholds and cross-community flexibility retained.';

          const s10 = step('1.4.2-step-10');
          s10.summary = 'From September 2028 to June 2029, operate the expanded six-community Strategic Communities of Practice portfolio. The convenors of the original Experiential Learning, AI in Education and Inclusive Education communities enter the second year of their Step 5 appointments, while the convenors of the three additional communities begin the first year of their Step 8 appointments. Activate the full 0.6 FTE convenor capacity and £24,000 annual community activity allowance, and support all six communities to deliver visible programmes aligned to their strategic education priorities while enabling participation and leadership beyond the funded convenors. Deliver approximately thirty practice-based projects—around five connected to each community—supported by approximately 3.0 FTE of protected project capacity and up to £30,000 of direct project expenditure. Operate with the expanded indicative central support baseline of 0.4 FTE Portfolio Lead and 0.8 FTE Portfolio Coordinator. Apply the refined reach and impact framework from Step 9, recognising differences in maturity while maintaining common expectations for active reach, distributed leadership, practice development and spread, institutional influence and student-facing contribution. Use termly portfolio reviews to support, challenge, recover or re-scope activity and complete a year-end six-community portfolio account by June 2029 to inform the permanent-model review in Step 12. On current planning assumptions, the complete annual six-community model has an indicative cash-equivalent value of approximately £498,000.';
          output(s10, '2028-29 practice-based project portfolio delivered').summary = 'Approximately thirty funded projects delivered—around five connected to each community—developing, testing or spreading useful educational practice and creating cross-community learning where appropriate.';
          Object.assign(capacity(s10, 'SCoP Portfolio Lead'), { fte: 0.4, role: 'SCoP Portfolio Lead (0.4 FTE)', contribution: 'Provide strategic leadership, support and challenge across six communities and around thirty projects, maintain coherence between the two convenor cohorts, connect insight to institutional routes and lead portfolio review using capacity established through Steps 2, 6 and 8.' });
          Object.assign(capacity(s10, 'SCoP Portfolio Coordinator'), { fte: 0.8, role: 'SCoP Portfolio Coordinator (0.8 FTE)', contribution: 'Coordinate six-community and approximately thirty-project administration, records, budgets, termly review, reach and impact evidence, governance papers, onboarding and succession processes using capacity established through Steps 2, 6 and 8.' });
          Object.assign(investment(s10, 'Funded convenor protected capacity across six communities'), {
            amount: 60000,
            currency: 'GBP',
            fte: 0.6,
            confidence: 'indicative',
            estimatedCost: '£60,000 annual cash-equivalent, using £10,000 per 0.1 FTE community envelope',
            rationale: 'Activates 0.1 FTE of protected capacity for each of six communities, shared where co-convenors are appointed. The estimate should be recalculated against named grades and local release, allocation or backfill routes.'
          });
          Object.assign(investment(s10, 'Protected capacity for the 2028-29 practice-based project portfolio'), {
            amount: 300000,
            currency: 'GBP',
            fte: 3,
            confidence: 'indicative',
            estimatedCost: '£300,000 annual cash-equivalent, using £10,000 per 0.1 FTE project envelope',
            rationale: 'Activates an indicative 0.1 FTE protected-capacity envelope for each of approximately thirty projects—around five per community—divisible across a small delivery team. The estimate should be recalculated against the actual grade mix and implementation routes.'
          });
          Object.assign(investment(s10, 'Direct delivery costs for the 2028-29 practice-based project portfolio'), {
            amount: 30000,
            currency: 'GBP',
            confidence: 'indicative',
            rationale: 'Provides up to £1,000 for each of approximately thirty projects for eligible direct costs including materials, small events, paid or otherwise formally recognised student partnership, accessibility, modest specialist input or dissemination.'
          });
          risk(s10, 'Five projects across six communities are perceived as insufficient or unfair').title = 'The five-project-per-community envelope drives volume rather than value';
          risk(s10, 'The five-project-per-community envelope drives volume rather than value').mitigation = 'Use quality, additionality and community-connection thresholds, permit fewer awards where needed, allow cross-community projects with one primary community and review whether the volume remains administratively and educationally worthwhile.';
          assumption(s10, 'Annual projects remain portfolio-wide').summary = 'Approximately five projects operate for each community—around thirty across the portfolio—and are selected through common quality and coherence standards. Cross-community projects have one primary community and count once.';

          const s11 = step('1.4.2-step-11');
          s11.summary = 'From January to March 2029, commission the Strategic Communities of Practice portfolio for the academic year beginning in September 2029 and prepare the operating model for institutional handover. Appoint one or two funded convenors for the next two-year term of the original Experiential Learning, AI in Education and Inclusive Education communities, covering 2029-30 and 2030-31. The convenors of the three additional communities appointed through Step 8 remain in post for the second year of their 2028-30 terms and are not routinely recommissioned. Commission approximately five practice-based projects for each community—around thirty projects across the full six-community portfolio—for 2029-30, using available evidence from the live Step 10 cycle without making completion of that cycle a prerequisite. Secure written faculty or organisational commitments and reserve the protected-capacity and direct-cost resources needed from September 2029. Complete the April-August succession, onboarding and readiness route, and assemble the governance, budget, process, records, minimum viable toolkit and ownership material required for the permanent model to transfer into King’s Academy after the Step 12 decision. This step commissions and prepares the first portfolio that will operate under business-as-usual arrangements; the permanent settlement itself is confirmed through Step 12 and activated through Step 13.';
          output(s11, '2029-30 practice-based project portfolio commissioned').summary = 'Approximately thirty practice-based projects commissioned—around five connected to each community—for delivery from September 2029.';
          Object.assign(capacity(s11, 'SCoP Portfolio Lead'), { fte: 0.4, role: 'SCoP Portfolio Lead (0.4 FTE)', contribution: 'Lead the final mobilisation commissioning cycle, maintain coherence across the staggered convenor cohorts and approximately thirty projects, oversee succession and prepare the institutional handover proposition.' });
          Object.assign(capacity(s11, 'SCoP Portfolio Coordinator'), { fte: 0.8, role: 'SCoP Portfolio Coordinator (0.8 FTE)', contribution: 'Administer applications, panels, commitments, conditions, onboarding, succession records, readiness tracking and the institutional handover pack for six communities and approximately thirty projects.' });
          decision(s11, 'Approve the 2029-30 project portfolio').summary = 'Approve approximately thirty projects—around five connected to each community—including conditions, reserve arrangements, cross-community coordination and any decision not to fill or to reallocate part of an envelope.';
          assumption(s11, 'The annual project portfolio remains approximately five projects').title = 'The annual project portfolio remains approximately five projects per community';
          assumption(s11, 'The annual project portfolio remains approximately five projects per community').summary = 'Projects continue to be selected through one common process, with an indicative envelope of around five for each community—around thirty in total—while retaining quality thresholds and cross-community flexibility.';

          const s12 = step('1.4.2-step-12');
          s12.summary = 'From July to August 2029, complete the formal review of the first full six-community operating cycle and confirm the permanent Strategic Communities of Practice model. Use the Step 10 portfolio account and the Step 11 commissioning and handover-readiness evidence to assess reach, participation, distributed leadership, practice development and spread, institutional influence, student-facing contribution, project delivery, expenditure, workload implementation, governance, support demand and differences in community maturity. Confirm or refine the six-community scale, staggered two-year convenor model, annual planning envelope of approximately five projects per community, common reach and impact framework, annual operating rhythm and the role of King’s Academy and the Innovation Committee. Confirm a clear lifecycle route through which communities can be renewed, supported, redefined, paused, closed or replaced where evidence or strategic priorities require it. Approve the permanent recurrent resource settlement, including the indicative 0.4 FTE Portfolio Lead, 0.8 FTE Portfolio Coordinator, 0.6 FTE convenor envelope, approximately 3.0 FTE annual project envelope, £24,000 annual community activity allowance and £30,000 annual direct project-cost allowance. On the current planning assumptions this is an annual cash-equivalent envelope of approximately £498,000, subject to grade-based valuation and confirmation of budget ownership and implementation routes before handover. Launch the 2030-31 annual project call across all six communities and the next convenor call for the three additional communities, whose first terms end in August 2030. Approve the institutional handover pack and the conditions through which Step 13 will activate business-as-usual ownership from September 2029.';
          output(s12, 'Permanent recurrent resource settlement approved').summary = 'A funded and implementable recurrent settlement for the permanent portfolio, with an indicative annual cash-equivalent of approximately £498,000 covering central support, community activity, convenor capacity, around thirty annual projects and direct project costs. Grade-based values, budget ownership and funding routes are confirmed without double-counting earlier BAU liabilities.';
          Object.assign(capacity(s12, 'Permanent Portfolio Lead baseline'), { fte: 0.4, role: 'Permanent Portfolio Lead baseline (0.4 FTE)', contribution: 'Provide the tested substantive leadership baseline for six communities and approximately thirty annual projects, subject to formal confirmation or evidence-based adjustment through this review.' });
          Object.assign(capacity(s12, 'Permanent Portfolio Coordinator baseline'), { fte: 0.8, role: 'Permanent Portfolio Coordinator baseline (0.8 FTE)', contribution: 'Provide the tested administrative, financial, evidence, governance and annual-cycle coordination baseline for six communities and approximately thirty annual projects.' });
          Object.assign(investment(s12, 'Permanent funded convenor protected-capacity envelope'), {
            amount: 60000,
            currency: 'GBP',
            fte: 0.6,
            bauLiability: true,
            owner: 'King’s Academy and participating faculties or organisational units',
            fundingRoute: 'TBC',
            fundingStatus: 'indicative',
            confidence: 'indicative',
            rationale: 'Converts the tested 0.1 FTE per-community model into a permanent recurrent capacity commitment. The £60,000 annual planning estimate uses £10,000 per 0.1 FTE and must be recalculated against the named convenors’ grades and agreed release, allocation or backfill routes.'
          });
          Object.assign(investment(s12, 'Permanent annual practice-based project protected-capacity envelope'), {
            amount: 300000,
            currency: 'GBP',
            fte: 3,
            bauLiability: true,
            owner: 'King’s Academy and participating faculties or organisational units',
            fundingRoute: 'TBC',
            fundingStatus: 'indicative',
            confidence: 'indicative',
            rationale: 'Converts the tested annual envelope of around thirty 0.1 FTE practice-based projects—approximately five per community—into permanent recurrent commissioning capacity. The £300,000 estimate must be recalculated against the actual grade mix and implementation routes.'
          });
          Object.assign(investment(s12, 'Permanent annual direct delivery allowance for practice-based projects'), {
            amount: 30000,
            currency: 'GBP',
            bauLiability: true,
            owner: 'King’s Academy',
            fundingRoute: 'TBC',
            fundingStatus: 'indicative',
            confidence: 'indicative',
            rationale: 'Maintains an allowance of up to £1,000 for each of approximately thirty annual projects for materials, engagement, accessibility, paid or otherwise formally recognised student partnership, small events, specialist input or dissemination.'
          });
          decision(s12, 'Approve the permanent portfolio scale and operating model').summary = 'Confirm the retained communities, staggered convenor cycle, annual planning envelope of around five projects per community, governance, evidence and annual rhythm. Confirm the proportionate lifecycle route for renewal, support, redefinition, pause, closure or replacement, including any evidence-based changes.';
          decision(s12, 'Approve the permanent recurrent resource settlement').summary = 'Confirm the protected capacities, grade-based cash values, £24,000 community activity allowance, £30,000 project direct-cost allowance, central-support baseline, budget ownership and recurrent funding route. The current indicative whole-model cash-equivalent is approximately £498,000 annually.';
          risk(s12, 'Permanent FTE is approved without a workable cash or workload route').mitigation = 'Use the current £10,000 per 0.1 FTE academic-capacity assumption only for planning, then require grade-based valuation, named funding sources and implementable release, allocation or backfill mechanisms before handover.';
          assumption(s12, 'The staggered annual rhythm continues').summary = 'One convenor cohort is recruited each year, approximately five projects per community are commissioned annually through a common quality-led process, and the portfolio is reviewed and calls launched each summer.';

          const s13 = step('1.4.2-step-13');
          s13.summary = 'From September to December 2029, execute the transition of the Strategic Communities of Practice portfolio into business as usual using the permanent model and resource settlement approved through Step 12. Activate King’s Academy as the accountable institutional owner, put the permanent Portfolio Lead and Portfolio Coordinator arrangements into effect, transfer budgets, records, systems, governance and decision rights, and retire temporary mobilisation dependencies. Begin the 2029-30 operating cycle under the permanent arrangements for the retained community portfolio and commissioned annual projects. Where Step 12 confirms the planned six-community model, the original three communities enter the first year of their Step 11 convenor terms and the additional three communities enter the second year of their Step 8 terms, with approximately thirty projects operating across the portfolio. Embed the recurring annual calendar, including the 2030-31 calls launched through Step 12 and the first BAU commissioning window from January to March 2030. Complete knowledge transfer from Mark Peace and other mobilisation contributors, including the minimum viable operating toolkit, close residual mobilisation actions or assign them into ordinary governance, complete an initial 90-day BAU assurance check, and schedule the later strategic review. Step 13 does not redesign or re-cost the model; it makes the approved settlement operational and closes the mobilisation programme.';
          Object.assign(capacity(s13, 'Permanent SCoP Portfolio Lead'), { fte: 0.4, role: 'Permanent SCoP Portfolio Lead (0.4 FTE)', contribution: 'Assume accountable substantive leadership of the permanent six-community and approximately thirty-project portfolio and lead the first BAU operating and commissioning cycles.' });
          Object.assign(capacity(s13, 'Permanent SCoP Portfolio Coordinator'), { fte: 0.8, role: 'Permanent SCoP Portfolio Coordinator (0.8 FTE)', contribution: 'Operate the annual calendar, records, calls, budgets, evidence, governance and continuity processes for six communities and approximately thirty annual projects under the permanent settlement.' });
          Object.assign(capacity(s13, 'Recurrent annual project protected-capacity envelope'), { fte: 3, role: 'Recurrent annual project protected-capacity envelope (3.0 FTE)', contribution: 'Activate the approved annual protected-capacity envelope for approximately thirty practice-based projects—around five per retained community.' });
          capacity(s13, 'Permanent community and project direct-cost budgets').contribution = 'Operate the approved £24,000 annual community activity allowance and £30,000 annual project direct-cost allowance.';
          output(s13, 'Records, systems and knowledge transferred').summary = 'The portfolio can operate without reliance on private files, informal memory or mobilisation-only access held by individual contributors. The transferred material includes the deliberately light operating toolkit, standard annual calendar, decision rights, community and project templates, compact termly dashboard and annual portfolio account.';

          const bauTotal = stepsData.steps
            .flatMap(s => s.resources?.newInvestment || [])
            .filter(r => r.bauLiability === true)
            .reduce((sum, r) => sum + (Number(r.amount) || 0), 0);
          assert.strictEqual(bauTotal, 498000, `Expected mature BAU liability £498,000, found £${bauTotal.toLocaleString('en-GB')}`);

          const serialized = JSON.stringify(stepsData);
          for (const stale of [
            'approximately five practice-based projects across the planned six-community',
            'approximately five practice-based projects across all six communities',
            'approximately five practice-based projects across the six-community portfolio',
            'approximately five funded projects delivered across the six-community portfolio',
            '£5,000 annual direct project'
          ]) {
            assert(!serialized.includes(stale), `Stale project-scale wording remains: ${stale}`);
          }

          fs.writeFileSync(overviewPath, JSON.stringify(overview, null, 2) + '\n');
          fs.writeFileSync(benefitsPath, JSON.stringify(benefits, null, 2) + '\n');
          fs.writeFileSync(measuresPath, JSON.stringify(measures, null, 2) + '\n');
          fs.writeFileSync(stepsPath, JSON.stringify(stepsData));
          NODE

      - name: Validate and build
        run: |
          npm ci
          npm run build

      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/apply-1-4-2-model-refinements.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/data/deliverables/1.4.2/overview.json src/data/deliverables/1.4.2/benefits.json src/data/deliverables/1.4.2/measures.json src/data/deliverables/1.4.2/steps.json .github/workflows/apply-1-4-2-model-refinements.yml
          git commit -m "Refine SCoP model and project scale"
          git push origin HEAD:content/1-4-2-refine-model-and-project-scale
