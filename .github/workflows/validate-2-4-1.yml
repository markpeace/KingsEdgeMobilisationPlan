name: Validate 2.4.1 proposition

on:
  push:
    branches:
      - agent/2-4-1-proposition-review

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate data
        run: npm run validate:data

      - name: Build
        run: npm run build

      - name: Check diff whitespace
        run: git diff --check origin/main...HEAD
