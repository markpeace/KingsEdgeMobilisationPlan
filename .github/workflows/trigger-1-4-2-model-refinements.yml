name: Trigger 1.4.2 model refinements

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract and run refinement script
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          source = Path('.github/workflows/apply-1-4-2-model-refinements.yml').read_text()
          start_marker = "          node <<'NODE'\n"
          end_marker = "\n          NODE"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          script = dedent(source[start:end]) + '\n'
          script = script.replace(
              "if (!items.some(existing => existing.id === item.id || existing.title === item.title)) items.push(item);",
              "if (!items.some(existing => (existing.id || existing.title || existing.item || existing.role) === (item.id || item.title || item.item || item.role))) items.push(item);"
          )
          scale_fix = r'''
          const scaleCorrections = [
            ['approximately five practice-based projects across the planned six-community portfolio', 'approximately thirty practice-based projects—around five connected to each community—across the planned six-community portfolio'],
            ['approximately five practice-based projects across all six communities', 'approximately thirty practice-based projects—around five connected to each community—across all six communities'],
            ['approximately five practice-based projects across the six-community portfolio', 'approximately thirty practice-based projects—around five connected to each community—across the six-community portfolio'],
            ['approximately five funded projects delivered across the six-community portfolio', 'approximately thirty funded projects—around five connected to each community—delivered across the six-community portfolio'],
            ['£5,000 annual direct project', '£30,000 annual direct project']
          ];
          let correctedStepsJson = JSON.stringify(stepsData);
          for (const [oldText, newText] of scaleCorrections) correctedStepsJson = correctedStepsJson.split(oldText).join(newText);
          stepsData.steps = JSON.parse(correctedStepsJson).steps;

          const serialized = JSON.stringify(stepsData);'''
          script = script.replace('const serialized = JSON.stringify(stepsData);', dedent(scale_fix).strip())
          Path('/tmp/apply-1-4-2.js').write_text(script)
          PY

          set +e
          node /tmp/apply-1-4-2.js > refinement-debug.log 2>&1
          status=$?
          set -e
          cat refinement-debug.log
          if [ "$status" -ne 0 ]; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add -f refinement-debug.log
            git commit -m "Capture SCoP refinement failure"
            git push origin HEAD:${{ github.head_ref }}
            exit "$status"
          fi

      - name: Validate and build
        run: |
          npm ci
          npm run build

      - name: Commit generated refinements
        run: |
          rm .github/workflows/apply-1-4-2-model-refinements.yml
          rm .github/workflows/trigger-1-4-2-model-refinements.yml
          rm -f refinement-debug.log
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Refine SCoP model and project scale"
          git push origin HEAD:${{ github.head_ref }}
