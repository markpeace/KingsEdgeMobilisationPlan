name: Trigger 1.4.2 model refinements

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract and run refinement script
        run: |
          sed -n "/node <<'NODE'/,/^          NODE$/p" .github/workflows/apply-1-4-2-model-refinements.yml \
            | sed '1d;$d;s/^          //' > /tmp/apply-1-4-2.js
          set +e
          node /tmp/apply-1-4-2.js > refinement-debug.log 2>&1
          status=$?
          set -e
          cat refinement-debug.log
          if [ "$status" -ne 0 ]; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add -f refinement-debug.log
            git commit -m "Capture SCoP refinement failure"
            git push origin HEAD:${{ github.head_ref }}
            exit "$status"
          fi

      - name: Validate and build
        run: |
          npm ci
          npm run build

      - name: Commit generated refinements
        run: |
          rm .github/workflows/apply-1-4-2-model-refinements.yml
          rm .github/workflows/trigger-1-4-2-model-refinements.yml
          rm -f refinement-debug.log
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Refine SCoP model and project scale"
          git push origin HEAD:${{ github.head_ref }}
