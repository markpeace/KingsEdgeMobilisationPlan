name: Verify 1.4.2 refinements

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - .github/workflows/verify-1-4-2-refinements.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create verification digest
        run: |
          node <<'NODE'
          const fs = require('fs');
          const { steps } = JSON.parse(fs.readFileSync('src/data/deliverables/1.4.2/steps.json', 'utf8'));
          const digest = steps.filter(s => Number(s.id.split('-').at(-1)) >= 5).map(s => ({
            id: s.id,
            title: s.title,
            summary: s.summary,
            outputs: (s.outputs || []).map(o => ({ title: o.title, summary: o.summary })),
            existingCapacity: (s.resources?.existingCapacity || []).map(r => ({ role: r.role, fte: r.fte, contribution: r.contribution })),
            newInvestment: (s.resources?.newInvestment || []).map(r => ({ item: r.item, amount: r.amount, currency: r.currency, fte: r.fte, bauLiability: r.bauLiability, estimatedCost: r.estimatedCost, rationale: r.rationale })),
            enablingConditions: (s.resources?.enablingConditions || []).map(r => r.condition),
            decisions: (s.decisions || []).map(d => ({ title: d.title, summary: d.summary })),
            risks: (s.risks || []).map(r => ({ title: r.title, mitigation: r.mitigation })),
            assumptions: (s.assumptions || []).map(a => ({ title: a.title, summary: a.summary }))
          }));
          fs.mkdirSync('tmp', { recursive: true });
          fs.writeFileSync('tmp/verify-1-4-2-refinements.json', JSON.stringify(digest, null, 2) + '\n');
          NODE

      - name: Commit verification digest
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f tmp/verify-1-4-2-refinements.json
          git commit -m "Create SCoP refinement verification digest"
          git push origin HEAD:${{ github.head_ref }}
