name: Combine and renumber SCoP commissioning steps

on:
  push:
    branches:
      - content/1-4-2-combine-commissioning-steps
    paths:
      - .github/workflows/apply-combined-commissioning-steps.yml

permissions:
  contents: write

jobs:
  update-steps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/1-4-2-combine-commissioning-steps

      - name: Combine and renumber later steps
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/data/deliverables/1.4.2/steps.json';
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));
          const byId = new Map(data.steps.map(step => [step.id, step]));
          const clone = value => JSON.parse(JSON.stringify(value));

          const remapStep = (step, oldNumber, newNumber, dependsOn) => {
            const oldPrefix = `1.4.2-step-${oldNumber}`;
            const newPrefix = `1.4.2-step-${newNumber}`;
            const remapped = JSON.parse(JSON.stringify(step).split(oldPrefix).join(newPrefix));
            remapped.id = newPrefix;
            remapped.dependsOn = dependsOn;
            return remapped;
          };

          const step1 = clone(byId.get('1.4.2-step-1'));
          const step2 = clone(byId.get('1.4.2-step-2'));
          const step3 = clone(byId.get('1.4.2-step-3'));
          const step4 = clone(byId.get('1.4.2-step-4'));
          const old5 = clone(byId.get('1.4.2-step-5'));
          const old6 = clone(byId.get('1.4.2-step-6'));
          const old7 = clone(byId.get('1.4.2-step-7'));
          const old8 = clone(byId.get('1.4.2-step-8'));
          const old9 = clone(byId.get('1.4.2-step-9'));
          const old10 = clone(byId.get('1.4.2-step-10'));
          const old11 = clone(byId.get('1.4.2-step-11'));
          const old12 = clone(byId.get('1.4.2-step-12'));
          const old13 = clone(byId.get('1.4.2-step-13'));
          const old14 = clone(byId.get('1.4.2-step-14'));
          const old15 = clone(byId.get('1.4.2-step-15'));
          const old16 = clone(byId.get('1.4.2-step-16'));

          if ([step1, step2, step3, step4, old5, old6, old7, old8, old9, old10, old11, old12, old13, old14, old15, old16].some(x => !x)) {
            throw new Error('Expected Steps 1-16 were not found');
          }

          // Step 4 informs the funded handover but does not gate it.
          const step4Text = JSON.stringify(step4)
            .replaceAll('Step 6 appointment, mobilisation and handover arrangements', 'Step 5 appointment, mobilisation and handover arrangements');
          const revisedStep4 = JSON.parse(step4Text);

          const step5 = {
            id: '1.4.2-step-5',
            title: 'Select, appoint and mobilise the first funded convenors and community projects',
            period: { start: old5.period.start, end: old6.period.end },
            summary: "From January to August 2027, run coordinated calls for funded Community Convenors and community-aligned projects, complete assessment and selection, and convert the approved portfolio into appointments and funded activity ready to begin in September. Confirm faculty release, workload allocation or backfill, budgets, project delivery arrangements, governance expectations and onboarding. Draw on relevant pilot learning and community continuity material from Step 4 as it becomes available, without making completion of the community pilots a prerequisite for selection, appointment or mobilisation.",
            dependsOn: ['1.4.2-step-2'],
            outputs: [
              {
                title: 'Completed institutional calls',
                summary: 'Convenor and project calls delivered through clear eligibility, applicant support, assessment and decision arrangements.'
              },
              {
                title: 'Selected funded leadership and project portfolio',
                summary: 'Successful convenors and projects approved for the first funded three-community operating cycle.'
              },
              {
                title: 'Confirmed funded appointments and projects',
                summary: 'Convenors, project leads, budgets, faculty release or backfill arrangements, governance expectations and delivery agreements confirmed for September commencement.'
              },
              {
                title: 'First funded cycle ready to operate',
                summary: 'The three communities, their funded convenors and selected projects are onboarded and mobilised for the 2027-28 academic year.'
              }
            ]
          };

          const step6 = remapStep(old7, 7, 6, ['1.4.2-step-4']);
          const step7 = remapStep(old8, 8, 7, ['1.4.2-step-5']);

          const step8 = {
            id: '1.4.2-step-8',
            title: 'Select, appoint and mobilise the expanded six-community portfolio',
            period: { start: old9.period.start, end: old10.period.end },
            summary: 'From September 2027 to August 2028, assess the 2028-29 convenor and community-project calls, complete selection, and mobilise the expanded portfolio for September 2028. Confirm renewed and new convenors, faculty release, workload allocation or backfill, budgets and project delivery arrangements; establish the three additional communities and their founding memberships and priorities; and prepare all six communities, convenors and funded projects to begin the next operating cycle together.',
            dependsOn: ['1.4.2-step-6'],
            outputs: [
              {
                title: 'Selected 2028-29 convenors and projects',
                summary: 'Renewed and new convenors and a funded project portfolio selected for the six-community operating cycle beginning in September 2028.'
              },
              {
                title: 'Expanded portfolio ready to operate',
                summary: 'All six communities, their funded convenors and their selected projects are established, appointed and mobilised for September 2028.'
              }
            ]
          };

          const step9 = remapStep(old11, 11, 9, ['1.4.2-step-7']);
          const step10 = remapStep(old12, 12, 10, ['1.4.2-step-8']);

          const step11 = {
            id: '1.4.2-step-11',
            title: 'Select, appoint and mobilise the 2029-30 portfolio and prepare institutional handover',
            period: { start: old13.period.start, end: old14.period.end },
            summary: 'From September 2028 to August 2029, assess the 2029-30 convenor and community-project calls, complete selection, and mobilise the next annual portfolio for September 2029. Confirm appointments, faculty release or backfill, budgets and project delivery arrangements. In parallel, capture the operational, governance, budget-holding, reporting and accountability requirements needed to transfer the portfolio from mobilisation into the permanent institutional model once approved.',
            dependsOn: ['1.4.2-step-9'],
            outputs: [
              {
                title: 'Selected 2029-30 portfolio',
                summary: 'Convenors and projects selected for the operating cycle beginning in September 2029.'
              },
              {
                title: 'Portfolio mobilised and handover prepared',
                summary: 'The next annual portfolio is mobilised for September and the practical operational, governance, reporting and resource requirements for institutional handover are documented.'
              }
            ]
          };

          const step12 = remapStep(old15, 15, 12, ['1.4.2-step-10']);
          step12.summary = 'During July and August 2029, review and report on the completed six-community operating cycle. Assess impact and sustainability, determine which communities should continue or evolve, and develop and approve the permanent institutional owner, governance arrangements, budget holding, recurrent resource settlement and annual planning cycle by the end of August. Use evidence from the operating cycles and the practical handover requirements captured through Step 11 to confirm or adjust the cumulative recurrent King\'s Academy portfolio leadership and administration settlement, without counting investment already introduced through earlier steps a second time.';
          step12.outputs = (step12.outputs || []).map(output => {
            const updated = clone(output);
            if (updated.id) updated.id = updated.id.replace('1.4.2-step-15', '1.4.2-step-12');
            if (updated.title === 'Approved permanent institutional model') {
              updated.summary = 'Permanent ownership, governance, budget holding, recurrent resources and the annual commissioning and operating rhythm developed and approved by the end of August 2029.';
            }
            if (Array.isArray(updated.acceptanceCriteria)) {
              updated.acceptanceCriteria = updated.acceptanceCriteria.map(item =>
                item.replace('Steps 2, 7 and 11', 'Steps 2, 6 and 9')
              );
            }
            return updated;
          });

          const step13 = remapStep(old16, 16, 13, ['1.4.2-step-11', '1.4.2-step-12']);

          data.steps = [step1, step2, step3, revisedStep4, step5, step6, step7, step8, step9, step10, step11, step12, step13];

          const ids = data.steps.map(step => step.id);
          if (new Set(ids).size !== ids.length) throw new Error('Duplicate step IDs after reflow');
          const idSet = new Set(ids);
          for (const step of data.steps) {
            for (const dependency of step.dependsOn || []) {
              if (!idSet.has(dependency)) throw new Error(`Invalid dependency ${dependency} on ${step.id}`);
            }
          }
          if (data.steps.length !== 13) throw new Error(`Expected 13 steps, found ${data.steps.length}`);
          if (step5.dependsOn.join(',') !== '1.4.2-step-2') throw new Error('Step 5 dependency is incorrect');
          if (step12.dependsOn.join(',') !== '1.4.2-step-10') throw new Error('Step 12 dependency is incorrect');
          if (step13.dependsOn.join(',') !== '1.4.2-step-11,1.4.2-step-12') throw new Error('Step 13 dependencies are incorrect');

          const serialized = JSON.stringify(data);
          if (serialized.includes('1.4.2-step-14') || serialized.includes('1.4.2-step-15') || serialized.includes('1.4.2-step-16')) {
            throw new Error('Obsolete step IDs remain after renumbering');
          }
          fs.writeFileSync(path, serialized);
          NODE

      - name: Validate JSON and sequence
        run: |
          node <<'NODE'
          const data = require('./src/data/deliverables/1.4.2/steps.json');
          const expected = Array.from({length: 13}, (_, i) => `1.4.2-step-${i + 1}`);
          const actual = data.steps.map(s => s.id);
          if (JSON.stringify(actual) !== JSON.stringify(expected)) {
            throw new Error(`Unexpected sequence: ${actual.join(', ')}`);
          }
          NODE

      - name: Commit reflowed steps
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/data/deliverables/1.4.2/steps.json
          git commit -m "Combine and renumber SCoP commissioning steps"
          git push origin HEAD:content/1-4-2-combine-commissioning-steps
